name: FI - completar diagnóstico desde evidencia de Actions (temporal)

on:
  push:
    branches: ['arena/01a0f8b4-sistema-de-informacion-financi']
    paths: [.github/workflows/fi_recuperar_revision_temporal.yml]

permissions:
  contents: read

jobs:
  recuperar:
    if: contains(github.event.head_commit.message, '[fi-evidencia-cobertura]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/01a0f8b4-sistema-de-informacion-financi
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check pyarrow==21.0.0 beautifulsoup4==4.13.5
      - uses: actions/download-artifact@v4
        with:
          name: fi-eeff-revision-cobertura
          run-id: 36932700351
          github-token: ${{ github.token }}
          path: .local-data/fi_eeff_cobertura_recuperada/
      - name: Reanalizar evidencia verificada y consultar solo fuentes nuevas o transitorias
        run: |
          python -m fi.scripts.revisar_cobertura_eeff --red --reanudar --minutos 15 --hilos 6 --out .local-data/fi_eeff_cobertura_recuperada
      - name: Recuperar solo diagnóstico; nunca Parquet ni fuentes masivas
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          origen = Path('.local-data/fi_eeff_cobertura_recuperada')
          dato = json.loads((origen / 'revision.json').read_text())
          assert dato['periodo'] == '2026-06'
          assert len(dato['fondos']) == 1679
          assert dato['revision_cmf']['revision_completa']
          salida = Path('docs/notas/revision_cobertura_fi_2026-10-01')
          salida.parent.mkdir(parents=True, exist_ok=True)
          salida.with_suffix('.json').write_text(json.dumps(dato, ensure_ascii=False, indent=2) + '\n')
          salida.with_suffix('.md').write_bytes((origen / 'revision.md').read_bytes())
          print(json.dumps({k: v for k,v in dato['revision_cmf'].items() if k != 'revisiones'}, ensure_ascii=False, indent=2))
          PY
          [ "${GITHUB_REF_NAME}" = "arena/01a0f8b4-sistema-de-informacion-financi" ]
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/notas/revision_cobertura_fi_2026-10-01.json docs/notas/revision_cobertura_fi_2026-10-01.md
          git diff --cached --quiet && exit 0
          git commit -m "FI: cobertura contrastada y altas fuera del padrón local"
          git push origin HEAD:arena/01a0f8b4-sistema-de-informacion-financi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fi-eeff-revision-cobertura-completa
          path: .local-data/fi_eeff_cobertura_recuperada/
          retention-days: 15
