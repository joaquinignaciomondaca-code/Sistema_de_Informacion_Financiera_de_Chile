name: Sonda temporal formato seguros 1835
on:
  push:
    branches: [arena/01a0e680-monitor-financiero-chile]
    paths: [.github/workflows/seguros_sonda.yml, seguros/scripts/sonda_formato_1835.py]
permissions:
  contents: write
jobs:
  fichas:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.ref_name }}'}
      - run: echo muestras
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python seguros/scripts/sonda_formato_1835.py CSVID:201610 CSVID:201611 CSVID:202411 CSGEN:202411 CSVID:202412 CSVID:202608 CSGEN:202608
      - run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seguros/fuentes/muestras_1835 && git commit -m "Muestras de líneas reales Circular 1835" && git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME"
