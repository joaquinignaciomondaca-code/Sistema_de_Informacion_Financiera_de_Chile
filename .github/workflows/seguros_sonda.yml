name: Sonda temporal formato seguros 1835
on:
  push:
    branches: [arena/01a0e680-monitor-financiero-chile]
    paths: [.github/workflows/seguros_sonda.yml, seguros/scripts/sonda_formato_1835.py]
permissions:
  contents: read
jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python seguros/scripts/sonda_formato_1835.py CSVID:202411 CSVID:202412 CSVID:202608 CSGEN:202412 CSVID:202609
