name: Sonda IFRS CMF vs maestro retail (sin publicación)

on:
  push:
    branches: [arena/01a0e5fb-monitor-financiero-chile]
    paths:
      - retail_financiero/scripts/probe_ifrs_rut_cross.py
      - .github/workflows/retail_probe_ifrs.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Cruce RUT IFRS 2026-06
        run: python retail_financiero/scripts/probe_ifrs_rut_cross.py 202606
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ifrs-ruts
          path: out/
