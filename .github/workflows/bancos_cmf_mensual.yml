name: Publicación CMF B1/B2/R1 (bancos), 3 veces al mes, incremental

on:
  schedule:
    # Tres intentos al mes (días 1, 11 y 21, 13:00 UTC). La CMF publica el mes M hacia fines de M+1,
    # así que cualquiera de los intentos lo recoge. Es incremental: los meses ya publicados se saltan
    # sin descargarse, y si el mes pendiente aún no está en la CMF la corrida termina sin cambios (en verde).
    - cron: '0 13 1,11,21 * *'
  # Primera carga automática: al fusionar/subir cambios del publicador se ejecuta
  # una vez y pone al día todos los meses cerrados pendientes desde 2026-07.
  push:
    branches:
      - main
    paths:
      - .github/workflows/bancos_cmf_mensual.yml
      - bancos/scripts/publish_cmf_bank_period.py
      - bancos/scripts/extract_cmf_bank_lines.py
      - bancos/scripts/inspect_cmf_bank_sample.py
      - bancos/tests/test_publish_cmf_bank_period.py
  workflow_dispatch:
    inputs:
      period:
        description: 'Período YYYY-MM opcional; en blanco toma el primer período pendiente desde 2026-07'
        required: false
        default: ''
        type: string

permissions:
  contents: write

concurrency:
  group: bancos-cmf-mensual-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    outputs:
      published_changed: ${{ steps.publish.outputs.published_changed }}
      period: ${{ steps.publish.outputs.period }}
    steps:
      - name: Checkout de la rama que recibirá la publicación
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias del cotejo y Parquet
        run: python -m pip install --disable-pip-version-check openpyxl==3.1.5 pyarrow==21.0.0

      - name: Probar extracción, gate de calidad e idempotencia
        run: python -m unittest bancos.tests.test_inspect_cmf_bank_sample bancos.tests.test_extract_cmf_bank_lines bancos.tests.test_publish_cmf_bank_period -v

      - name: Extraer, cotejar y publicar una partición (o saltar si ya existe)
        id: publish
        env:
          PERIOD: ${{ github.event_name == 'workflow_dispatch' && inputs.period || '' }}
          # Historia completa desde el plan de cuentas CMF de 9 dígitos; los meses
          # ya publicados se saltan, así que la corrida mensual solo agrega lo nuevo.
          HISTORY_START: '2022-01'
        run: |
          args=()
          if [ -n "$PERIOD" ]; then args+=(--period "$PERIOD"); else args+=(--catch-up --desde "$HISTORY_START" --max-periods 120); fi
          python -m bancos.scripts.publish_cmf_bank_period "${args[@]}"

      - name: Confirmar el período validado para que la web recoja los cambios
        if: steps.publish.outputs.published_changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # El commit de datos lleva solo lo que escribe este workflow (las particiones y su
          # manifiesto). data_manifest.json lo editan todos los publicadores: si viajara en el commit
          # chocaría con la edición de otro, y reintentar no sirve: el conflicto persiste mientras esa
          # edición esté en la rama, así que el período quedaba sin publicar. Se descarta la edición local y se regenera
          # sobre la cabeza vigente tras integrar los datos (`--solo-data-manifest`), como hacen los
          # demás publicadores.
          git add docs/outputs/bancos/cmf_b1_b2_r1
          if git diff --cached --quiet; then
            echo 'No hay cambios que confirmar.'
            exit 0
          fi
          git commit -m "Publica período CMF bancario ${{ steps.publish.outputs.period }}"
          git checkout -- data_manifest.json
          datos=$(git rev-parse HEAD)
          # Un cherry-pick en conflicto o un push rechazado no deben abortar el paso (la shell corre
          # con `bash -e`): se reintenta sobre la cabeza nueva, con espera aleatoria para
          # desincronizar las corridas que arrancan juntas, y si aun así no se puede publicar se deja
          # un error explícito en vez de un paso rojo sin explicación.
          for intento in 1 2 3 4 5 6 7 8; do
            git fetch origin "${GITHUB_REF_NAME}"
            git reset --hard FETCH_HEAD
            if ! git cherry-pick "$datos"; then
              git cherry-pick --abort || git reset --hard FETCH_HEAD
              echo "Cherry-pick en conflicto (intento ${intento}/8): otra publicación tocó los mismos archivos."
              sleep $(( 15 + RANDOM % 20 ))
              continue
            fi
            python -m bancos.scripts.publish_cmf_bank_period --solo-data-manifest
            # El catálogo de Descargas (JS estático) se regenera sobre la versión final de la rama.
            python scripts/build_download_catalog.py
            git add data_manifest.json docs/js/download_catalog.js
            git diff --cached --quiet || git commit -m "Banca: data_manifest y catálogo de descargas"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
            echo "Push rechazado (intento ${intento}/8): otra corrida publicó primero."
            sleep $(( 15 + RANDOM % 20 ))
          done
          echo "::error title=Publicación en la rama::No se pudo publicar el período bancario tras 8 intentos por contención en ${GITHUB_REF_NAME}"
          exit 1
