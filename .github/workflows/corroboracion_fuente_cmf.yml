name: Corroboración fuente CMF (auditoría, manual)

# Herramienta de la auditoría 2026-10-07 (docs/notas/auditoria_seguros_2026-10-07.md):
# descarga de la CMF los ZIP de meses puntuales y comprueba, con el archivo crudo, si los
# hallazgos de calidad (duplicados exactos, doble reporte de control, fechas imposibles)
# vienen de la fuente o son artefacto del lector. No publica nada: solo imprime el análisis
# y sube un JSON por mes como artifact.
on:
  workflow_dispatch:
  # Temporal de la auditoría 2026-10-07 (reintento 2): corre solo al empujar esta rama (workflow_dispatch
  # por nombre de archivo no resuelve ramas que no son la por defecto).
  push:
    branches:
      - arena/48e54022-sistema-de-informacion-financi
    paths:
      - .github/workflows/corroboracion_fuente_cmf.yml
      - seguros/scripts/corroborar_fuente_cmf.py

permissions:
  contents: read

jobs:
  corroborar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check pandas==2.2.3 pyarrow==21.0.0
      - name: Descargar y comparar meses puntuales contra la fuente
        run: >
          python -m seguros.scripts.corroborar_fuente_cmf
          2016-11:vida 2017-02:vida 2018-06:vida
          2024-06:vida 2024-06:generales 2024-11:vida
          2025-01:vida 2025-03:vida 2025-05:vida 2025-05:generales
      - uses: actions/upload-artifact@v4
        with:
          name: corroboracion-fuente-cmf
          path: /tmp/corroboracion/*.json
          retention-days: 7
