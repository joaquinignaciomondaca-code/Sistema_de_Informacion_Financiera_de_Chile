name: Estados financieros IFRS de AGF, securitizadoras y cajas de compensación (CMF), 3 veces al mes, incremental

on:
  schedule:
    # Días 2, 12 y 22 (13:30 UTC). La CMF publica un TXT trimestral con los estados IFRS de todas
    # las sociedades. Los trimestres cerrados (más de 150 días) no se vuelven a descargar; los
    # recientes se releen para sumar a quienes presentan tarde.
    - cron: '30 13 2,12,22 * *'
  push:
    branches:
      - main
      - arena/01a0e680-monitor-financiero-chile
    paths:
      - .github/workflows/ifrs_sectores.yml
      - pipelines/ifrs_sectores/actualizar.py
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ifrs-sectores-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validar-y-publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      publicados: ${{ steps.publicar.outputs.publicados }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: python -m pip install --disable-pip-version-check pandas==2.2.3 pyarrow==21.0.0

      - name: Descargar y publicar los trimestres pendientes
        id: publicar
        run: python pipelines/ifrs_sectores/actualizar.py --minutos 70

      - name: Confirmar los trimestres publicados
        if: always() && steps.publicar.outcome != 'skipped'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rutas="docs/outputs/ifrs_sectores docs/outputs/agf/agf_balance docs/outputs/agf/agf_resultados docs/outputs/securitizadoras/securitizadoras_balance docs/outputs/securitizadoras/securitizadoras_resultados docs/outputs/cajas_compensacion/ccaf_balance docs/outputs/cajas_compensacion/ccaf_resultados"
          git add $rutas
          if git diff --cached --quiet; then echo 'Sin cambios.'; exit 0; fi
          ultimo=$(python -c "import json;print(max(json.load(open('docs/outputs/ifrs_sectores/manifest.json'))['periodos']))")
          git commit -m "IFRS AGF, securitizadoras y CCAF: hasta ${ultimo}"
          git checkout -- data_manifest.json
          datos=$(git rev-parse HEAD)
          for i in 1 2 3 4 5; do
            git fetch origin "${GITHUB_REF_NAME}"
            git reset --hard FETCH_HEAD
            git cherry-pick "$datos"
            python pipelines/ifrs_sectores/actualizar.py --solo-data-manifest
            git add data_manifest.json
            git diff --cached --quiet || git commit -m "IFRS sectores: data_manifest"
            git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep 20
          done
          exit 1

  desplegar-sitio:
    needs: validar-y-publicar
    if: needs.validar-y-publicar.result == 'success' && needs.validar-y-publicar.outputs.publicados != '0' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
      - run: git pull --ff-only origin "${GITHUB_REF_NAME}" || true
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
