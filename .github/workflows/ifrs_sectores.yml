name: Estados financieros IFRS de AGF, securitizadoras y cajas de compensación (CMF) y altas de CCAF y factoring/leasing, cada 3 días, incremental

on:
  schedule:
    # Cada 3 días (13:30 UTC). La CMF publica un TXT trimestral con los estados IFRS de todas
    # las sociedades. Los trimestres cerrados (más de 150 días) no se vuelven a descargar; los
    # recientes se releen para sumar a quienes presentan tarde. Las CCAF y sociedades de
    # factoring/leasing que reportan en el último trimestre y no están en su lista se agregan.
    - cron: '30 13 */3 * *'
  push:
    branches:
      - main
    paths:
      - .github/workflows/ifrs_sectores.yml
      - pipelines/ifrs_sectores/actualizar.py
      # Módulos compartidos que importa el extractor: un cambio en el parseo del TXT o en las
      # compuertas contables también debe volver a probar y a publicar.
      - pipelines/auto/ifrs_txt.py
      - pipelines/auto/cuadratura.py
      - pipelines/auto/estable.py
      - pipelines/auto/rut.py
  workflow_dispatch:
    inputs:
      desde:
        description: 'Primer cierre (AAAA-MM); vacío = el más antiguo pendiente'
        default: ''
        type: string
      hasta:
        description: 'Último cierre (vacío = último admisible)'
        default: ''
        type: string
      minutos:
        description: 'Tiempo máximo en minutos; el progreso se conserva'
        default: '270'
        type: string
      max_periodos:
        description: 'Máximo de cierres a revisar por corrida (0 = sin tope)'
        default: '0'
        type: string

permissions:
  contents: write

concurrency:
  group: ifrs-sectores-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validar-y-publicar:
    runs-on: ubuntu-latest
    # --minutos admite hasta 270; con 90 el job se cortaba antes de agotar el presupuesto.
    timeout-minutes: 300
    outputs:
      publicados: ${{ steps.publicar.outputs.publicados }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: python -m pip install --disable-pip-version-check pandas==2.2.3 pyarrow==21.0.0

      # Sin red y en segundos: lo que decide qué se publica (reparto por sector, compuertas
      # contables, guardas contra pérdida de filas, relectura de cierres reeditados) no puede
      # llegar a la web sin haber pasado sus pruebas. `test_roundtrip_publicado` y `test_sondeo`
      # quedan en la auditoría de la web y en el sondeo: dependen de los datos ya publicados.
      - name: Pruebas del extractor y de las compuertas contables
        run: >
          python -m unittest -v
          pipelines.ifrs_sectores.tests.test_actualizar
          pipelines.auto.tests.test_ifrs_txt
          pipelines.auto.tests.test_cuadratura
          pipelines.auto.tests.test_estable
          pipelines.entidades.tests.test_conteos

      - name: Descargar y publicar los trimestres pendientes
        id: publicar
        env:
          DESDE: ${{ inputs.desde }}
          HASTA: ${{ inputs.hasta }}
          MINUTOS: ${{ inputs.minutos }}
          PERIODOS: ${{ inputs.max_periodos }}
        run: |
          args=()
          if [ -n "${DESDE}" ]; then args+=(--desde "${DESDE}"); fi
          if [ -n "${HASTA}" ]; then args+=(--hasta "${HASTA}"); fi
          python pipelines/ifrs_sectores/actualizar.py --minutos "${MINUTOS:-270}" \
            --max-periodos "${PERIODOS:-0}" "${args[@]}"

      - name: Confirmar los trimestres publicados
        if: always() && steps.publicar.outcome != 'skipped'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rutas="docs/outputs/ifrs_sectores docs/outputs/agf/agf_balance docs/outputs/agf/agf_resultados docs/outputs/securitizadoras/securitizadoras_balance docs/outputs/securitizadoras/securitizadoras_resultados docs/outputs/cajas_compensacion/ccaf_balance docs/outputs/cajas_compensacion/ccaf_resultados docs/outputs/cajas_compensacion/ccaf_maestro.json docs/outputs/cajas_compensacion/ccaf_maestro.parquet docs/outputs/factoring_leasing/factoring_leasing_maestro.json docs/outputs/factoring_leasing/factoring_leasing_maestro.parquet docs/outputs/entidades/novedades_ifrs.json"
          git add $rutas
          if git diff --cached --quiet; then echo 'Sin cambios.'; exit 0; fi
          ultimo=$(python -c "import json;print(max(json.load(open('docs/outputs/ifrs_sectores/manifest.json'))['periodos']))")
          git commit -m "IFRS AGF, securitizadoras y CCAF: hasta ${ultimo}"
          git checkout -- data_manifest.json
          datos=$(git rev-parse HEAD)
          # Varias publicaciones compiten por la misma rama: un cherry-pick en
          # conflicto o un push rechazado no deben abortar el paso (la shell corre
          # con `bash -e`). Se reintenta sobre la cabeza nueva, con espera aleatoria
          # para desincronizar las corridas que arrancan juntas.
          for i in 1 2 3 4 5 6 7 8; do
            git fetch origin "${GITHUB_REF_NAME}"
            git reset --hard FETCH_HEAD
            if ! git cherry-pick "$datos"; then
              git cherry-pick --abort || git reset --hard FETCH_HEAD
              echo "Cherry-pick en conflicto (intento ${i}/8): otra publicación tocó los mismos archivos."
              sleep $(( 15 + RANDOM % 20 ))
              continue
            fi
            python pipelines/ifrs_sectores/actualizar.py --solo-data-manifest
            python pipelines/entidades/actualizar_listas.py --solo-conteos
            python scripts/build_download_catalog.py
            git add data_manifest.json docs/js/sidebar.js docs/js/data_dictionary.js docs/js/download_catalog.js
            git diff --cached --quiet || git commit -m "IFRS sectores: data_manifest"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
            echo "Push rechazado (intento ${i}/8): otra corrida publicó primero."
            sleep $(( 15 + RANDOM % 20 ))
          done
          echo "::error title=Publicación en la rama::No se pudo publicar tras 8 intentos por contención en ${GITHUB_REF_NAME}"
          exit 1

