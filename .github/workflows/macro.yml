name: Actualización macro (staging para revisión)

on:
  workflow_dispatch:
  schedule:
    # Día 8 de cada mes, 10:00 UTC (fuera del horario de cierre de la fuente).
    - cron: '0 10 8 * *'

permissions:
  contents: read

concurrency:
  group: macro-update
  cancel-in-progress: false

jobs:
  update:
    # Manual: prueba puntual. Solo el cron requiere habilitación explícita.
    if: github.event_name == 'workflow_dispatch' || vars.ENABLE_MACRO_AUTOMATION == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: macro/requirements.txt
      - name: Instalar dependencias macro
        run: python -m pip install -r macro/requirements.txt
      - name: Generar staging y validar
        env:
          BCCH_EMAIL: ${{ secrets.USER_BCCH }}
          BCCH_PASSWORD: ${{ secrets.PASSWORD_BCCH }}
        run: |
          test -n "$BCCH_EMAIL" && test -n "$BCCH_PASSWORD" || { echo 'Faltan secrets USER_BCCH o PASSWORD_BCCH'; exit 1; }
          python -c 'from macro.scripts.pipeline_stream_macro_bcch import run_macro_pipeline; run_macro_pipeline()'
          python -m macro.scripts.publish_macro
      - name: Preparar paquete de datos para revisión humana
        if: success()
        run: |
          mkdir -p .local-data/review/docs/outputs/macro
          cp docs/outputs/macro/*.parquet docs/outputs/macro/*.json .local-data/review/docs/outputs/macro/
          cp data_manifest.json .local-data/review/
      - name: Guardar resultado validado (sin commits ni publicación directa)
        uses: actions/upload-artifact@v4
        with:
          name: macro-validada
          path: .local-data/review/
          retention-days: 30
          if-no-files-found: error
