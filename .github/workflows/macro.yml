name: Actualización macro (incremental diaria)

on:
  schedule:
    # Diario 10:00 UTC. Cada serie se consulta solo desde su último dato (más una ventana corta
    # de revisión); lo ya publicado nunca se borra.
    - cron: '0 10 * * *'
  push:
    branches:
      - main
    paths:
      - .github/workflows/macro.yml
      - macro/scripts/series_bcch.py
      - macro/scripts/build_tablas_tematicas.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: macro-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      publicado: ${{ steps.commit.outputs.publicado }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: macro/requirements.txt
      - name: Instalar dependencias macro
        run: python -m pip install -r macro/requirements.txt
      - name: Descargar series nativas BCCh (incremental)
        env:
          BCCH_EMAIL: ${{ secrets.USER_BCCH }}
          BCCH_PASSWORD: ${{ secrets.PASSWORD_BCCH }}
        run: |
          test -n "$BCCH_EMAIL" && test -n "$BCCH_PASSWORD" || { echo 'Faltan secrets USER_BCCH o PASSWORD_BCCH'; exit 1; }
          python -m macro.scripts.series_bcch
      - name: Construir tablas temáticas y auditar
        # Pivota las series nativas en las 23 tablas temáticas de la web. Si la
        # auditoría falla no se publica nada (los Parquet quedan sin commit).
        run: |
          python -m macro.scripts.build_tablas_tematicas
          python -m macro.scripts.audit_macro_bcch
      - name: Publicar en el repositorio
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/outputs/macro
          if git diff --cached --quiet; then echo 'Sin cambios.'; echo "publicado=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          git commit -m "Macro BCCh: actualización diaria $(date -u +%F)"
          git checkout -- data_manifest.json
          datos=$(git rev-parse HEAD)
          # Varias publicaciones compiten por la misma rama: un cherry-pick en
          # conflicto o un push rechazado no deben abortar el paso (la shell corre
          # con `bash -e`). Se reintenta sobre la cabeza nueva, con espera aleatoria
          # para desincronizar las corridas que arrancan juntas.
          for i in 1 2 3 4 5 6 7 8; do
            git fetch origin "${GITHUB_REF_NAME}"
            git reset --hard FETCH_HEAD
            if ! git cherry-pick "$datos"; then
              git cherry-pick --abort || git reset --hard FETCH_HEAD
              echo "Cherry-pick en conflicto (intento ${i}/8): otra publicación tocó los mismos archivos."
              sleep $(( 15 + RANDOM % 20 ))
              continue
            fi
            python -m macro.scripts.build_tablas_tematicas --solo-data-manifest
            python scripts/build_download_catalog.py
            git add data_manifest.json docs/js/download_catalog.js
            git diff --cached --quiet || git commit -m "Macro BCCh: data_manifest"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then echo "publicado=true" >> "$GITHUB_OUTPUT"; exit 0; fi
            echo "Push rechazado (intento ${i}/8): otra corrida publicó primero."
            sleep $(( 15 + RANDOM % 20 ))
          done
          echo "::error title=Publicación en la rama::No se pudo publicar tras 8 intentos por contención en ${GITHUB_REF_NAME}"
          exit 1

