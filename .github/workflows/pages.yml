name: Publicar web (GitHub Pages)

# La web ES el producto: `docs/` es el sitio estático (visor DuckDB-Wasm + Parquet). El horario de
# cada 6 horas mantiene la publicación al día cuando un publicador usa GITHUB_TOKEN. Además, la
# cadena de contrato y el regenerador de sitemap la disparan al terminar, porque esos commits no
# generan un evento `push` que inicie otro workflow.
#
# Requiere un ajuste del dueño del repositorio que ningún workflow puede hacer por sí solo:
# Settings → Pages → Build and deployment → Source: **GitHub Actions**. Si falta, el paso previo lo
# advierte en la corrida y termina en verde en vez de dejar un aspa roja permanente.

on:
  schedule:
    - cron: '15 3,9,15,21 * * *'
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'data_manifest.json'
      - '.github/workflows/pages.yml'
  workflow_run:
    workflows:
      - 'Contrato derivado (web, esquemas, catálogo y resultados)'
      - 'SEO · Sitemap automático (GitHub Action gratuita)'
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

# Por qué `ubuntu-24.04` y no `ubuntu-latest`
#
# `ubuntu-latest` deja de ser Ubuntu 24.04 y pasa a 26.04 entre el 19 de octubre y el
# 19 de noviembre de 2026 (actions/runner-images#14748). Durante esas semanas la misma
# etiqueta da una imagen u otra sin aviso, así que un flujo puede pasar en una corrida y
# fallar en la siguiente sin que cambie una línea del repositorio. Es exactamente el patrón
# que se veía en las anotaciones: «The ubuntu-latest label will migrate to Ubuntu 26…».
#
# Estos flujos publican datos en `main`, así que un fallo intermitente no es solo ruido: deja
# la serie sin actualizar hasta la corrida siguiente (cada 3 días en la mayoría). Por eso la
# imagen se fija explícitamente. `contrato_publicado` y `seguros_carteras` ya lo hacían.
#
# Para probar Ubuntu 26 se cambia a `ubuntu-26.04` en una rama, no en `main`. Para volver a
# la etiqueta móvil hay que esperar al fin de la migración y correr la auditoría completa.

jobs:
  desplegar:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Comprobar que GitHub Pages acepta despliegues desde Actions
        id: destino
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # `configure-pages` aborta con un mensaje que no dice qué falta. Se consulta el origen
          # configurado: si Pages está apagado o en modo rama, no hay destino donde publicar y se
          # informa el cambio exacto en lugar de fallar (activarlo es un ajuste de configuración).
          estado=$(curl -sS -o /tmp/pages.json -w '%{http_code}' \
            -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages")
          if [ "${estado}" != "200" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=GitHub Pages sin publicar desde Actions::GET /repos/${GITHUB_REPOSITORY}/pages devolvió ${estado}. Activar Settings → Pages → Build and deployment → Source: GitHub Actions; hecho eso, la próxima corrida publica sin tocar el repositorio."
            exit 0
          fi
          origen=$(python3 -c 'import json;d=json.load(open("/tmp/pages.json"));print((d.get("build_config") or {}).get("build_type") or "legacy")')
          if [ "${origen}" != "workflow" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=GitHub Pages en modo rama::el sitio se sirve con build_type=${origen}. Para publicar desde Actions cambiar Settings → Pages → Source a «GitHub Actions»; mientras tanto este flujo no despliega para no pisar el otro mecanismo."
            exit 0
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"
          echo "Sitio actual: $(python3 -c 'import json;print(json.load(open("/tmp/pages.json")).get("html_url","?"))')"

      - name: Configurar Pages
        if: steps.destino.outputs.enabled == 'true'
        uses: actions/configure-pages@v6

      - name: Empaquetar docs/ como artefacto del sitio
        if: steps.destino.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

      - name: Desplegar
        if: steps.destino.outputs.enabled == 'true'
        id: despliegue
        uses: actions/deploy-pages@v5
