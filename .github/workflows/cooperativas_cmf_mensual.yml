name: Publicación mensual CMF cooperativas (balance y resultados)

on:
  schedule:
    # Día 16 de cada mes (la CMF publica el reporte del mes anterior hacia fin de mes).
    - cron: '0 14 16 * *'
  push:
    branches:
      - main
      - arena/01a0e66e-monitor-financiero-chile
    paths:
      - .github/workflows/cooperativas_cmf_mensual.yml
      - cooperativas/scripts/extract_cmf_coop_report.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cooperativas-cmf-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check openpyxl==3.1.5 xlrd==2.0.1 pyarrow==21.0.0
      - name: Tests del extractor
        run: python -m unittest cooperativas.tests.test_extract_cmf_coop_report -v
      - name: Descargar, validar y reconstruir la serie completa (2017-01 → último mes)
        run: python -m cooperativas.scripts.extract_cmf_coop_report --publicar
      - name: Confirmar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/outputs/cooperativas/cmf_reporte_financiero
          if git diff --cached --quiet; then echo 'Sin cambios.'; exit 0; fi
          git commit -m "Publica reporte financiero CMF de cooperativas"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
