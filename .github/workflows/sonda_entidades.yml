name: Sonda temporal registros de entidades
on:
  push:
    branches: [arena/01a0e680-monitor-financiero-chile]
    paths: [pipelines/entidades/sonda/sonda.py, .github/workflows/sonda_entidades.yml]
permissions:
  contents: write
jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.ref_name }}", fetch-depth: 1}
      - run: python pipelines/entidades/sonda/sonda.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pipelines/entidades/sonda/resultado
          git commit -m "Sonda temporal: resultado" || exit 0
          for i in 1 2 3; do git pull --rebase -q origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && exit 0; sleep 10; done
