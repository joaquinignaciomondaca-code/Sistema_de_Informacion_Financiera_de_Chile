name: Cartera de inversiones de fondos de inversión (CMF, informes IFRS trimestrales), cada 3 días, incremental

on:
  schedule:
    # Cada 3 días (15:00 UTC). Los fondos presentan la cartera trimestral con sus estados
    # financieros (60 días; 90 el cierre anual). El publicador espera 75/100 días desde el cierre,
    # exige el 90 % de los fondos del trimestre anterior y no repite trimestres ya publicados.
    # La carga histórica avanza por tramos de hasta 4,5 horas por corrida.
    - cron: '0 15 */3 * *'
  push:
    branches:
      - main
      - 'arena/**'
    paths:
      - .github/workflows/fi_carteras.yml
      - fi/scripts/actualizar_carteras.py
      - fi/scripts/backfill_pactos_historico.py
      - fi/tests/test_actualizar_carteras.py
      # Módulos compartidos que importan el extractor: un cambio ahí debe volver a probar
      # y a publicar (en las corridas programadas no corre el job `pruebas` de web_audit).
      - pipelines/auto/estable.py
      - pipelines/auto/rut.py
  workflow_dispatch:
    inputs:
      desde:
        description: 'Primer cierre (AAAA-MM); vacío = autodescubre el más antiguo disponible'
        default: ''
        type: string
      hasta:
        description: 'Último cierre (vacío = último admisible por plazo CMF)'
        default: ''
        type: string
      minutos:
        description: 'Tiempo máximo en minutos; el progreso se conserva'
        default: '270'
        type: string
      max_periodos:
        description: 'Máximo de cierres a revisar por corrida (0 = sin tope)'
        default: '0'
        type: string
      hilos:
        description: 'Descargas simultáneas (default 16; máx 32)'
        default: '16'
        type: string
      historico_pactos:
        description: 'Sondear y recuperar solo pactos VRC/CRV anteriores a 2020'
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: fi-carteras-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validar-y-publicar:
    # En ramas de trabajo se ejecuta solo ante el marcador explícito de backfill;
    # las actualizaciones normales de FI siguen reservadas a main o a workflow_dispatch.
    if: github.ref_name == 'main' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[fi-pactos-backfill]'))
    runs-on: ubuntu-latest
    timeout-minutes: 330
    # Los nombres de contrapartes y emisores traen tildes: el modo UTF-8 de Python evita que una
    # lectura/escritura sin encoding explícito dependa del locale del runner.
    env:
      PYTHONUTF8: '1'
    outputs:
      publicados: ${{ steps.publicar.outputs.publicados }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: python -m pip install --disable-pip-version-check pandas==2.2.3 pyarrow==21.0.0

      # El trimestre solo se publica si la guardería de filas y la escritura atómica están sanas.
      - name: Probar la escritura estable y el parser de pactos
        run: python -m unittest -v pipelines.auto.tests.test_estable fi.tests.test_actualizar_carteras

      - name: Descargar, validar y publicar los trimestres pendientes
        id: publicar
        env:
          DESDE: ${{ inputs.desde }}
          HASTA: ${{ inputs.hasta }}
          MINUTOS: ${{ inputs.minutos }}
          PERIODOS: ${{ inputs.max_periodos }}
          HILOS: ${{ inputs.hilos }}
          HISTORICO_PACTOS: ${{ inputs.historico_pactos == true || (github.event_name == 'push' && contains(github.event.head_commit.message, '[fi-pactos-backfill]')) }}
        run: |
          if [ "${HISTORICO_PACTOS:-false}" = "true" ]; then
            python -u -m fi.scripts.backfill_pactos_historico \
              --desde "${DESDE:-2008-03}" --hasta "${HASTA:-2019-12}" \
              --minutos "${MINUTOS:-270}" --max-periodos "${PERIODOS:-0}" --hilos "${HILOS:-16}"
          else
            args=()
            if [ -n "${DESDE}" ]; then args+=(--desde "${DESDE}"); fi
            if [ -n "${HASTA}" ]; then args+=(--hasta "${HASTA}"); fi
            python -m fi.scripts.actualizar_carteras --minutos "${MINUTOS:-270}" \
              --max-periodos "${PERIODOS:-0}" --hilos "${HILOS:-16}" "${args[@]}"
          fi

      - name: Confirmar los trimestres publicados
        if: always() && steps.publicar.outcome != 'skipped'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Primero solo los datos del sector (no chocan con otros workflows); luego, sobre la
          # versión más reciente de la rama, se recalculan las entradas del sector en data_manifest.json.
          git add docs/outputs/fi
          if git diff --cached --quiet; then echo 'Sin cambios.'; exit 0; fi
          ultimo=$(python -c "import json;print(max(json.load(open('docs/outputs/fi/manifest.json'))['periodos']))")
          git commit -m "FI: cartera de inversiones hasta ${ultimo}"
          git checkout -- data_manifest.json
          datos=$(git rev-parse HEAD)
          # Varias publicaciones compiten por la misma rama: un cherry-pick en
          # conflicto o un push rechazado no deben abortar el paso (la shell corre
          # con `bash -e`). Se reintenta sobre la cabeza nueva, con espera aleatoria
          # para desincronizar las corridas que arrancan juntas.
          for i in 1 2 3 4 5 6 7 8; do
            git fetch origin "${GITHUB_REF_NAME}"
            git reset --hard FETCH_HEAD
            if ! git cherry-pick "$datos"; then
              git cherry-pick --abort || git reset --hard FETCH_HEAD
              echo "Cherry-pick en conflicto (intento ${i}/8): otra publicación tocó los mismos archivos."
              sleep $(( 15 + RANDOM % 20 ))
              continue
            fi
            python -m fi.scripts.actualizar_carteras --solo-data-manifest
            python scripts/build_download_catalog.py
            git add data_manifest.json docs/js/download_catalog.js
            git diff --cached --quiet || git commit -m "FI: data_manifest"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
            echo "Push rechazado (intento ${i}/8): otra corrida publicó primero."
            sleep $(( 15 + RANDOM % 20 ))
          done
          echo "::error title=Publicación en la rama::No se pudo publicar tras 8 intentos por contención en ${GITHUB_REF_NAME}"
          exit 1

