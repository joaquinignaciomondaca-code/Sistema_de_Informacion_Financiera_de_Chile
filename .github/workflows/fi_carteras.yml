name: Cartera de inversiones de fondos de inversión (CMF, informes IFRS trimestrales), 3 veces al mes, incremental

on:
  schedule:
    # Días 9, 19 y 29 (15:00 UTC). Los fondos presentan la cartera trimestral con sus estados
    # financieros (60 días; 90 el cierre anual). El publicador espera 75/100 días desde el cierre,
    # exige el 90 % de los fondos del trimestre anterior y no repite trimestres ya publicados.
    # La carga histórica avanza por tramos de hasta 4,5 horas por corrida.
    - cron: '0 15 9,19,29 * *'
  push:
    branches:
      - main
    paths:
      - .github/workflows/fi_carteras.yml
      - fi/scripts/actualizar_carteras.py
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: fi-carteras-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validar-y-publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    outputs:
      publicados: ${{ steps.publicar.outputs.publicados }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: python -m pip install --disable-pip-version-check pandas==2.2.3 pyarrow==21.0.0

      - name: Descargar, validar y publicar los trimestres pendientes
        id: publicar
        run: python -m fi.scripts.actualizar_carteras --minutos 270

      - name: Confirmar los meses publicados
        if: always() && steps.publicar.outcome != 'skipped'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Primero solo los datos del sector (no chocan con otros workflows); luego, sobre la
          # versión más reciente de la rama, se recalculan las entradas del sector en data_manifest.json.
          git add docs/outputs/fi
          if git diff --cached --quiet; then echo 'Sin cambios.'; exit 0; fi
          ultimo=$(python -c "import json;print(max(json.load(open('docs/outputs/fi/manifest.json'))['periodos']))")
          git commit -m "FI: cartera de inversiones hasta ${ultimo}"
          git checkout -- data_manifest.json
          datos=$(git rev-parse HEAD)
          for i in 1 2 3 4 5; do
            git fetch origin "${GITHUB_REF_NAME}"
            git reset --hard FETCH_HEAD
            git cherry-pick "$datos"
            python -m fi.scripts.actualizar_carteras --solo-data-manifest
            python scripts/build_download_catalog.py
            git add data_manifest.json docs/js/download_catalog.js
            git diff --cached --quiet || git commit -m "FI: data_manifest"
            git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep 20
          done
          exit 1

  desplegar-sitio:
    needs: validar-y-publicar
    if: needs.validar-y-publicar.result == 'success' && needs.validar-y-publicar.outputs.publicados != '0' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
      - run: git pull --ff-only origin "${GITHUB_REF_NAME}" || true
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
