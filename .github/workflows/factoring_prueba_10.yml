name: Prueba EEFF factoring — 10 PDF

# Diez PDF de marzo 2026, segundo lote. No es el masivo. El resultado queda en
# actions/fl-extraccion-<periodo>-<run> para revisarlo. No toca securitizadoras.
on:
  push:
    branches: [arena/01a0db9a-monitor-financiero-chile]
    paths:
      - .github/workflows/factoring_prueba_10.yml
      - factoring_leasing/eeff_prueba/run.json
      - factoring_leasing/eeff_prueba/lote2.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prueba:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Dependencias
        run: pip install -q pymupdf pdfplumber
      - name: Parser sin red
        run: python pipelines/eeff/test_parse_pdf_caratula.py
      - name: Diez PDF, segundo lote
        run: |
          set +e
          mkdir -p factoring_leasing/eeff_prueba/lote2
          python factoring_leasing/scripts/04_prueba_10_pdf.py --periodo 2026-03 --lote factoring_leasing/eeff_prueba/lote2.json --dest lote2 > factoring_leasing/eeff_prueba/lote2/corrida.txt 2>&1
          echo "exit=$?" >> factoring_leasing/eeff_prueba/lote2/corrida.txt
          tail -50 factoring_leasing/eeff_prueba/lote2/corrida.txt
      - name: Rama de revisión
        if: always()
        run: |
          RAMA="actions/fl-extraccion-lote2-${{ github.run_id }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$RAMA"
          git add factoring_leasing/eeff_prueba/lote2
          git status --short
          git commit -m "factoring: prueba lote 2, marzo 2026, run ${{ github.run_id }}" || echo "sin cambios"
          git push -u origin "$RAMA"
