# Investiga sin publicar: coteja archivo estructurado CMF contra fichas de dos entidades.
name: Factoring y Leasing - cotejo de muestra (sin publicación)

on:
  push:
    branches: [arena/01a0e08b-monitor-financiero-chile]
    paths:
      - 'factoring_leasing/scripts/audit_structured_sample.py'
      - 'factoring_leasing/tests/test_audit_structured_sample.py'
      - '.github/workflows/factoring_leasing_sample.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cotejo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pruebas de controles de identidad, periodo, importes y unidad
        run: python -m unittest discover -s factoring_leasing/tests -p test_audit_structured_sample.py -v
      - name: Descargar dos fichas y archivos CMF; cotejar sin escribir datos del sitio
        run: python factoring_leasing/scripts/audit_structured_sample.py
      - name: Guardar evidencia de cuarentena
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: factoring-leasing-cotejo-muestra
          path: .local-data/factoring_leasing_muestra/
          retention-days: 30
          if-no-files-found: warn
