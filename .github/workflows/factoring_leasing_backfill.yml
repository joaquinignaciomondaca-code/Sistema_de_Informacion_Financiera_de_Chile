# Backfill IFRS y publicación automática en docs/ solo al completar el índice CMF.
name: Factoring y Leasing - serie IFRS CMF y publicación automática

on:
  push:
    branches: [arena/01a0e08b-monitor-financiero-chile]
    paths:
      - '.github/workflows/factoring_leasing_backfill.yml'
      - 'factoring_leasing/scripts/backfill_ifrs.py'
      - 'factoring_leasing/scripts/publish_backfill.py'
      - 'factoring_leasing/tests/test_backfill_ifrs.py'
      - 'factoring_leasing/tests/test_publish_backfill.py'
      - 'factoring_leasing/tests/test_publication.py'
      - 'factoring_leasing/scripts/audit_factoring_leasing.py'
      - 'scripts/audit_navigation.py'
  workflow_dispatch:
    inputs:
      batch:
        description: 'Cantidad máxima de períodos pendientes en esta corrida (default 100)'
        required: false
        default: '100'
        type: string
  schedule:
    - cron: '20 12 * * *'

permissions:
  contents: write

concurrency:
  group: factoring-leasing-ifrs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  extraer:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencias y pruebas de extracción y publicación
        run: |
          python -m pip install 'pandas>=2.2,<4' 'pyarrow>=17,<26'
          python -m unittest discover -s factoring_leasing/tests -v
      - name: Recuperar períodos ya descargados (solo esta rama)
        uses: actions/cache/restore@v4
        with:
          path: .local-data/factoring_leasing_serie
          key: fl-ifrs-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            fl-ifrs-${{ github.ref_name }}-
      - name: Continuar historia y revisar si apareció un trimestre nuevo
        env:
          BATCH: ${{ inputs.batch }}
        run: python factoring_leasing/scripts/backfill_ifrs.py --batch "${BATCH:-100}"
      - name: Preparar tablas públicas solo si la serie está completa
        if: success()
        run: python factoring_leasing/scripts/publish_backfill.py
      - name: Auditar visor, catálogos y Parquets generados
        if: success()
        run: |
          if [ -f docs/outputs/factoring_leasing/factoring_leasing_balance_serie_ifrs_cmf.parquet ]; then
            python scripts/audit_navigation.py
            python scripts/audit_web_full.py
          else
            echo 'Backfill pendiente: aún no se publican archivos ni referencias web.'
          fi
      - name: Guardar archivos web generados en la rama del workflow
        id: publish_docs
        if: success()
        run: |
          if [ ! -f docs/outputs/factoring_leasing/factoring_leasing_balance_serie_ifrs_cmf.parquet ] || \
             [ ! -f docs/outputs/factoring_leasing/factoring_leasing_resultados_serie_ifrs_cmf.parquet ]; then
            echo "La extracción aún está incompleta; no se publica."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/outputs/factoring_leasing/factoring_leasing_balance_serie_ifrs_cmf.parquet \
                  docs/outputs/factoring_leasing/factoring_leasing_resultados_serie_ifrs_cmf.parquet \
                  docs/outputs/factoring_leasing/factoring_leasing_balance_serie_ifrs_cmf_metadata.json \
                  docs/js/duckdb_client.js docs/js/sidebar.js docs/js/data_viewer.js \
                  docs/js/data_dictionary.js docs/index.html data_manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "Publicar serie completa IFRS de Factoring y Leasing desde Actions"
            git push origin "HEAD:${GITHUB_REF_NAME}"
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          else
            echo "La web ya está al día; no hay archivos nuevos que publicar."
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Conservar progreso para próxima corrida aun si falló la CMF
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .local-data/factoring_leasing_serie
          key: fl-ifrs-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Artifact recuperable con particiones fuente y estado
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: factoring-leasing-serie-cmf-periodos
          path: .local-data/factoring_leasing_serie/
          retention-days: 90
          if-no-files-found: warn
      - name: Resumen visible de extracción y publicación
        if: always()
        env:
          DOCS_PUSHED: ${{ steps.publish_docs.outputs.pushed }}
        run: |
          if [ -f .local-data/factoring_leasing_serie/resumen.json ]; then
            cat .local-data/factoring_leasing_serie/resumen.json >> "$GITHUB_STEP_SUMMARY"
            echo "Docs generados subidos a la rama: ${DOCS_PUSHED:-no}" >> "$GITHUB_STEP_SUMMARY"
            python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path('.local-data/factoring_leasing_serie/resumen.json').read_text())
          fields = ('estado_global', 'publicado_en_docs', 'parquets_docs', 'rut_catalogo',
                    'periodos_indice', 'completados_total', 'filas_balance_total',
                    'filas_resultados_total', 'importes_no_enteros_total',
                    'cuentas_contexto_repetidas_total', 'ruts_con_datos_total',
                    'ruts_sin_datos_hasta_ahora', 'pendientes', 'errores')
          concise = {k: r.get(k) for k in fields}
          concise['push_docs_a_rama'] = __import__('os').environ.get('DOCS_PUSHED', 'no')
          print('::notice::FL_BACKFILL_PROGRESS=' + json.dumps(concise, ensure_ascii=False))
          PY
          else
            echo 'Sin resumen: falló antes de consultar el índice CMF.' >> "$GITHUB_STEP_SUMMARY"
          fi
