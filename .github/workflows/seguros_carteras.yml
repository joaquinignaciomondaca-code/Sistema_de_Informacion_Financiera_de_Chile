name: Cartera de inversiones de seguros (CMF, Circular 1835), 3 veces al mes, incremental

on:
  schedule:
    # Días 7, 17 y 27 (14:00 UTC). Las compañías informan el mes M hasta mediados de M+1 y la CMF
    # lo publica después; cualquiera de los tres intentos lo recoge. Es incremental: los meses ya
    # publicados no se descargan, y si el mes pendiente aún no está la corrida termina sin cambios.
    - cron: '0 14 7,17,27 * *'
  # Primera carga: al subir cambios del publicador se ejecuta y completa los meses pendientes.
  push:
    branches:
      - main
      - arena/01a0e680-monitor-financiero-chile
    paths:
      - .github/workflows/seguros_carteras.yml
      - seguros/scripts/actualizar_carteras.py
      - seguros/scripts/formato_1835.py
  workflow_dispatch:
    inputs:
      max_periodos:
        description: 'Máximo de meses a procesar en esta corrida'
        required: false
        default: '240'
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: seguros-carteras-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validar-y-publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    outputs:
      publicados: ${{ steps.publicar.outputs.publicados }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: python -m pip install --disable-pip-version-check pandas==2.2.3 pyarrow==21.0.0

      - name: Probar el lector con líneas reales de ambos formatos
        run: python -m seguros.tests.test_formato_1835

      - name: Descargar, validar y publicar los meses pendientes
        id: publicar
        run: python -m seguros.scripts.actualizar_carteras --max-periodos "${{ inputs.max_periodos || '240' }}"

      # Se confirma también si un mes posterior falló la validación: los meses anteriores ya
      # quedaron validados y escritos; el mes con problemas no se publica y la corrida queda en rojo.
      - name: Confirmar los meses publicados
        if: always() && steps.publicar.outcome != 'skipped'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/outputs/seguros
          if git diff --cached --quiet; then echo 'Sin cambios.'; exit 0; fi
          ultimo=$(python -c "import json;print(max(json.load(open('docs/outputs/seguros/manifest.json'))['periodos']))")
          git commit -m "Seguros: cartera de inversiones hasta ${ultimo}"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

  desplegar-sitio:
    needs: validar-y-publicar
    if: needs.validar-y-publicar.result == 'success' && needs.validar-y-publicar.outputs.publicados != '0' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
      - run: git pull --ff-only origin "${GITHUB_REF_NAME}" || true
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
