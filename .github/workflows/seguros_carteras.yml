name: Cartera de inversiones de seguros (CMF, Circular 1835), cada 3 días, incremental

on:
  schedule:
    # Cada 3 días (14:00 UTC). Las compañías informan el mes M hasta mediados de M+1 y la CMF
    # lo publica después; cualquiera de los tres intentos lo recoge. Es incremental: los meses ya
    # publicados no se descargan, y si el mes pendiente aún no está la corrida termina sin cambios.
    - cron: '0 14 */3 * *'
  # Primera carga: al subir cambios del publicador se ejecuta y completa los meses pendientes.
  push:
    branches:
      - main
      - arena/16880910-sistema-de-informacion-financi
    paths:
      - .github/workflows/seguros_carteras.yml
      - seguros/scripts/actualizar_carteras.py
      - seguros/tests/
      - seguros/scripts/formato_1835.py
      - seguros/scripts/vistas_1835.py
      - seguros/scripts/metadatos_web.py
      - seguros/scripts/diccionario_1835.py
      - docs/vocabulario.json
      - docs/js/data_dictionary.js
      - docs/js/data_viewer.js
      - docs/js/sidebar.js
      - docs/js/duckdb_client.js
      # La ficha y el inventario definen posiciones y columnas: si cambian, hay que volver a
      # probar y publicar (B.6 y B.9–B.11 entraron por acá).
      - seguros/scripts/ficha_1835.py
      - seguros/scripts/inventario_1835.py
      - seguros/fuentes/fichas_tecnicas_1835/
      # Módulos compartidos que importan el extractor: un cambio ahí debe volver a probar
      # y a publicar (en las corridas programadas no corre el job `pruebas` de web_audit).
      - pipelines/auto/estable.py
      - pipelines/auto/privacidad.py
      - pipelines/auto/rut.py
  workflow_dispatch:
    inputs:
      desde:
        description: 'Primer cierre (AAAA-MM); vacío = 2016-11'
        default: ''
        type: string
      hasta:
        description: 'Último cierre (vacío = último admisible por plazo CMF)'
        default: ''
        type: string
      minutos:
        description: 'Tiempo máximo en minutos; el progreso se conserva'
        default: '270'
        type: string
      max_periodos:
        description: 'Máximo de cierres a revisar por corrida (0 = sin tope)'
        default: '0'
        type: string
      forzar:
        description: 'Reconstruir: volver a publicar los meses del rango aunque ya estén publicados'
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: seguros-carteras-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validar-y-publicar:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    outputs:
      publicados: ${{ steps.publicar.outputs.publicados }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: python -m pip install --disable-pip-version-check pandas==2.2.3 pyarrow==21.0.0

      # El test del lector (seguros/tests/test_formato_1835.py) no define TestCase: es un
      # módulo con main() que verifica cuadraturas y exclusión sobre líneas reales de la CMF.
      # `python -m unittest` sobre él corre 0 pruebas y siempre sale verde: hay que correrlo
      # como módulo para que el lector se pruebe de verdad antes de publicar.
      - name: Probar el lector con líneas reales de ambos formatos y la escritura estable
        run: |
          python -m seguros.tests.test_formato_1835
          python -m seguros.tests.test_inventario_1835
          python -m seguros.tests.test_registros_2024
          python -m unittest -v seguros.tests.test_vistas_1835 seguros.tests.test_diagnostico_1835 pipelines.auto.tests.test_estable pipelines.auto.tests.test_privacidad
          python -m seguros.scripts.diccionario_1835 --check

      # Sonda de solo lectura, habilitada únicamente por el mensaje de un commit temporal.
      # No imprime valores: reporta hashes, tipos, largos y máscaras de caracteres de las líneas.
      - name: Auditar layouts de excepciones residuales (solo lectura)
        if: ${{ github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Audita causas residuales Circular 1835') }}
        run: |
          python - <<'PY'
          import collections, hashlib, io, zipfile
          from seguros.scripts.actualizar_carteras import descargar

          objetivos = [
              ("vida", "2025-05", "a202505g.99017000", "largo"),
              ("vida", "2025-05", "c202505v.99289000", "x"),
              *(("vida", f"2026-{m:02d}", f"g2026{m:02d}v.76282191", "4") for m in range(4, 10)),
          ]

          def decodificar(raw):
              try:
                  return raw.decode("utf-8")
              except UnicodeDecodeError:
                  return raw.decode("latin-1")

          def mascara(texto):
              def clase(c):
                  return "_" if c.isspace() else "9" if c.isdigit() else "A" if c.isalpha() else "."
              clases = [clase(c) for c in texto]
              spans, inicio = [], 0
              for i in range(1, len(clases) + 1):
                  if i == len(clases) or clases[i] != clases[inicio]:
                      spans.append(f"{inicio + 1}-{i}:{clases[inicio]}x{i-inicio}")
                      inicio = i
              return ";".join(spans)

          for sector, periodo, buscado, tipo_objetivo in objetivos:
              data = descargar(sector, periodo, None)
              with zipfile.ZipFile(io.BytesIO(data)) as z:
                  nombre = next((n for n in z.namelist()
                                 if n.rsplit("/", 1)[-1].lower() == buscado.lower()), None)
                  if nombre is None:
                      raise SystemExit(f"No se encontró el archivo esperado {buscado} en {periodo}")
                  raw_file = z.read(nombre)
              raw_lines = [x.rstrip(b"\r") for x in raw_file.split(b"\n") if x.strip(b"\r\x1a ")]
              lines = [decodificar(x) for x in raw_lines]
              tipos = collections.Counter(x[:1] for x in lines)
              if tipo_objetivo == "largo":
                  objetivo = [(i + 1, x, raw_lines[i]) for i, x in enumerate(lines) if len(x) != 572]
              else:
                  objetivo = [(i + 1, x, raw_lines[i]) for i, x in enumerate(lines) if x[:1] == tipo_objetivo]
              print(f"::notice title=Auditoría de excepción::{periodo} {sector} {buscado}; "
                    f"zip_sha256={hashlib.sha256(data).hexdigest()}; "
                    f"member_sha256={hashlib.sha256(raw_file).hexdigest()}; "
                    f"member_bytes={len(raw_file)}; líneas={len(lines)}; largos="
                    f"{dict(collections.Counter(map(len, lines)))}; tipos={dict(tipos)}; "
                    f"líneas_objetivo={len(objetivo)}")
              for numero, texto, raw in objetivo:
                  print(f"  línea={numero}; bytes={len(raw)}; chars={len(texto)}; "
                        f"ascii={raw.isascii()}; máscara={mascara(texto)}")
          PY

      # Revisa los meses pendientes sin escribir; informa conteos B.11–B.14 y separa errores fatales
      # de archivos excluidos con advertencia. Las descargas quedan en /tmp/cmf1835.
      - name: Diagnóstico de los meses pendientes (no escribe)
        continue-on-error: true
        run: python -m seguros.scripts.actualizar_carteras --diagnostico --cache /tmp/cmf1835 --max-periodos "${{ inputs.max_periodos || '240' }}"

      - name: Descargar, validar y publicar los meses pendientes
        id: publicar
        env:
          DESDE: ${{ inputs.desde }}
          HASTA: ${{ inputs.hasta }}
          MINUTOS: ${{ inputs.minutos }}
          PERIODOS: ${{ inputs.max_periodos }}
          FORZAR: ${{ inputs.forzar }}
        run: |
          args=()
          if [ -n "${DESDE}" ]; then args+=(--desde "${DESDE}"); fi
          if [ -n "${HASTA}" ]; then args+=(--hasta "${HASTA}"); fi
          if [ "${FORZAR}" = "true" ]; then args+=(--forzar); fi
          python -m seguros.scripts.actualizar_carteras --cache /tmp/cmf1835 \
            --minutos "${MINUTOS:-270}" --max-periodos "${PERIODOS:-0}" "${args[@]}"

      # Se confirma también si un mes posterior falló la validación: los meses anteriores ya
      # quedaron validados y escritos; el mes con problemas no se publica y la corrida queda en rojo.
      - name: Confirmar los meses publicados
        if: always() && steps.publicar.outcome != 'skipped'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Primero solo los datos del sector (no chocan con otros workflows); luego, sobre la
          # versión más reciente de la rama, se recalculan las entradas del sector en data_manifest.json.
          git add docs/outputs/seguros
          if git diff --cached --quiet; then echo 'Sin cambios.'; exit 0; fi
          ultimo=$(python -c "import json;print(max(json.load(open('docs/outputs/seguros/manifest.json'))['periodos']))")
          git commit -m "Seguros: cartera de inversiones hasta ${ultimo}"
          git checkout -- data_manifest.json
          datos=$(git rev-parse HEAD)
          # Varias publicaciones compiten por la misma rama: un cherry-pick en
          # conflicto o un push rechazado no deben abortar el paso (la shell corre
          # con `bash -e`). Se reintenta sobre la cabeza nueva, con espera aleatoria
          # para desincronizar las corridas que arrancan juntas.
          for i in 1 2 3 4 5 6 7 8; do
            git fetch origin "${GITHUB_REF_NAME}"
            git reset --hard FETCH_HEAD
            if ! git cherry-pick "$datos"; then
              git cherry-pick --abort || git reset --hard FETCH_HEAD
              echo "Cherry-pick en conflicto (intento ${i}/8): otra publicación tocó los mismos archivos."
              sleep $(( 15 + RANDOM % 20 ))
              continue
            fi
            python -m seguros.scripts.actualizar_carteras --solo-data-manifest
            python scripts/build_download_catalog.py
            git add data_manifest.json docs/js/download_catalog.js
            git diff --cached --quiet || git commit -m "Seguros: data_manifest"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
            echo "Push rechazado (intento ${i}/8): otra corrida publicó primero."
            sleep $(( 15 + RANDOM % 20 ))
          done
          echo "::error title=Publicación en la rama::No se pudo publicar tras 8 intentos por contención en ${GITHUB_REF_NAME}"
          exit 1

