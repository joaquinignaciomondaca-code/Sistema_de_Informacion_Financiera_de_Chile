name: Monitor normativo CMF por industria

on:
  schedule:
    # Revisión diaria; la fecha real de ejecución se muestra por separado de
    # la fecha de publicación de la última norma.
    - cron: '23 13 * * 1-5'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/normativa_cmf.yml'
      - 'pipelines/normativa_cmf/**'
      - 'docs/js/normativa_monitor.js'
      - 'docs/js/sidebar.js'
      - 'docs/js/data_viewer.js'
      - 'docs/index.html'
      - 'docs/css/app.css'
      - 'scripts/audit_normativa_web.js'
      - 'docs/outputs/normativa_cmf/feed.json'
      - 'data/normativa_cmf/state.json'

  # Sólo pruebas y auditorías: en un pull_request no se consulta la CMF ni se
  # publica nada (los pasos que escriben llevan `if: github.event_name != 'pull_request'`).
  # Existe porque el monitor salió de la navegación y esta auditoría siguió
  # exigiendo su pestaña: el flujo programado fallaba todos los días por una
  # decisión editorial ya tomada, y nadie lo veía antes de mezclar. Con este
  # disparador, cualquier cambio en la web o en el pipeline tiene que dejar la
  # auditoría en verde para poder entrar a main.
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/normativa_cmf.yml'
      - 'pipelines/normativa_cmf/**'
      - 'scripts/audit_normativa_web.js'
      - 'scripts/audit_interfaz.py'
      - 'docs/index.html'
      - 'docs/css/app.css'
      - 'docs/js/normativa_monitor.js'
      - 'docs/js/sidebar.js'
      - 'docs/js/data_viewer.js'
      - 'docs/js/ux_shell.js'
      - 'docs/outputs/normativa_cmf/feed.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: normativa-cmf-${{ github.ref }}
  cancel-in-progress: false

jobs:
  actualizar-feed:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout de la rama que inició el flujo
        uses: actions/checkout@v7
        with:
          # En push y schedule se trabaja sobre la rama que dispara el flujo (el
          # último paso publica ahí). En pull_request `github.ref_name` vale
          # "123/merge", que no es una ref de checkout: con la cadena vacía se
          # toma el commit de mezcla que arma GitHub, que es justo lo que hay
          # que auditar.
          ref: ${{ github.event_name != 'pull_request' && github.ref_name || '' }}
          fetch-depth: 1

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: pipelines/normativa_cmf/requirements.txt

      - name: Instalar dependencias
        run: python -m pip install --disable-pip-version-check -r pipelines/normativa_cmf/requirements.txt

      - name: Ejecutar pruebas y auditoría de integración web
        run: |
          python -m unittest discover -s pipelines/normativa_cmf/tests -v
          node scripts/audit_normativa_web.js

      - name: Actualizar publicaciones CMF y análisis respaldado
        # En un pull_request este flujo sólo audita: no consulta la CMF ni escribe en la rama.
        if: github.event_name != 'pull_request'
        env:
          API_GOOGLE_AI_STUDIO: ${{ secrets.API_GOOGLE_AI_STUDIO }}
          # Alias oficiales latest: el modelo se actualiza sin cambiar el workflow.
          GEMINI_MODEL_FLASH_LITE: gemini-flash-lite-latest
          GEMINI_MODEL_FLASH: gemini-flash-latest
          NORMATIVA_LOOKBACK_DAYS: '365'
          NORMATIVA_PDF_RECHECK_DAYS: '45'
          # Una pausa de 6 s limita las solicitudes a un máximo aproximado de 10 por minuto.
          NORMATIVA_GEMINI_MIN_INTERVAL_SECONDS: '6'
          # Hasta dos llamadas por publicación, con margen para el backlog residual.
          NORMATIVA_MAX_AI_CALLS: '20'
          NORMATIVA_MAX_PDF_CHECKS: '120'
        run: python -m pipelines.normativa_cmf.pipeline

      - name: Auditar feed y estado después de la consulta oficial
        # En un pull_request este flujo sólo audita: no consulta la CMF ni escribe en la rama.
        if: github.event_name != 'pull_request'
        run: python -m pipelines.normativa_cmf.audit --require-run

      - name: Guardar salida en la misma rama
        # En un pull_request este flujo sólo audita: no consulta la CMF ni escribe en la rama.
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/normativa_cmf/state.json docs/outputs/normativa_cmf/feed.json
          if git diff --cached --quiet; then
            echo 'Feed y estado sin cambios.'
          else
            git commit -m "CMF: actualizar novedades normativas"
            # Otros workflows actualizan esta misma rama; rebasar la salida
            # sobre el último tip evita perder el feed por una carrera de push.
            # Un rebase en conflicto tampoco debe abortar el paso: la shell corre
            # con `bash -e` y cualquier código distinto de cero lo termina.
            for intento in 1 2 3 4 5 6; do
              git fetch --deepen=50 origin "${GITHUB_REF_NAME}"
              if ! git rebase FETCH_HEAD; then
                git rebase --abort || true
                echo "Rebase en conflicto (intento ${intento}/6): otra publicación tocó los mismos archivos."
                sleep $(( 15 + RANDOM % 20 ))
                continue
              fi
              if git push origin "HEAD:${GITHUB_REF_NAME}"; then
                exit 0
              fi
              echo "Push concurrente rechazado (intento ${intento}/6)."
              sleep $(( 15 + RANDOM % 20 ))
            done
            echo "::error title=Publicación en la rama::No se pudo publicar el feed normativo tras 6 intentos por contención en ${GITHUB_REF_NAME}"
            exit 1
          fi

