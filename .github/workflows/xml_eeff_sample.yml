name: Cotejo muestra EEFF XML vs ficha CMF (sin publicación)

on:
  push:
    branches: [arena/01a0e08b-monitor-financiero-chile]
    paths:
      - 'pipelines/xml_eeff/**'
      - '.github/workflows/xml_eeff_sample.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  cotejo:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencias y pruebas
        run: |
          python -m pip install 'pandas>=2.2,<4' 'pyarrow>=17,<26'
          python -m unittest discover -s pipelines/xml_eeff/tests -v
      - name: Descargar dos XML y sus fichas HTML; cotejar cuatro cuentas y escribir Parquet de muestra
        id: muestra
        continue-on-error: true
        run: python pipelines/xml_eeff/audit_sample.py
      - name: Subir evidencia privada de revisión (NO publicarla en docs/outputs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cotejo-xml-cmf-muestra
          path: .local-data/xml_eeff_muestra/
          retention-days: 30
          if-no-files-found: error
      - name: Diagnóstico cotejo (JSON textual sin enlaces efímeros)
        if: always()
        run: |
          cat .local-data/xml_eeff_muestra/cotejo_muestra.json || true
          python - <<'PYNOTE'
          import json
          from pathlib import Path
          p = Path('.local-data/xml_eeff_muestra/cotejo_muestra.json')
          if not p.exists():
              print('::error::No se generó cotejo_muestra.json')
          else:
              d = json.loads(p.read_text())
              print('::notice::Muestra aprobada=' + str(d['aprobada_muestra']) + ', registros=' + str(len(d['registros'])))
              # La descarga del artifact no es accesible desde algunos entornos;
              # un registro compacto por anotación permite reconstruir el Parquet.
              for r in d['registros']:
                  print('::notice::MUESTRA_B64=' + __import__('base64').b64encode(json.dumps(r, ensure_ascii=False).encode('utf-8')).decode('ascii'))
              for e in d['errores']:
                  message = str(e['error']).replace('\n',' ')[:350]
                  print('::error::' + e['sector'] + ' ' + e['rut'] + ' ' + e['periodo'] + ': ' + message)
          PYNOTE
      - name: Publicar diagnóstico de cotejo en comentario del PR
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PYREPORT'
          import json, os, urllib.request
          from pathlib import Path
          p = Path('.local-data/xml_eeff_muestra/cotejo_muestra.json')
          data = json.loads(p.read_text()) if p.exists() else {'aprobada_muestra': False, 'errores': [{'error': 'Reporte no producido'}]}
          body = (f"<!-- cotejo-eeff-xml-muestra -->\n**Cotejo XML vs ficha CMF** "
                  f"run {os.environ['GITHUB_RUN_ID']} (commit {os.environ['GITHUB_SHA'][:12]}): "
                  f"{'MUESTRA APROBADA' if data['aprobada_muestra'] else 'NO APROBADA'}\n\n"
                  f"```json\n{json.dumps(data, ensure_ascii=False, indent=2)}\n```")
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f: f.write(body)
          url = f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/issues/3/comments"
          req = urllib.request.Request(url, json.dumps({'body': body}).encode(),
              headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                       'Accept': 'application/vnd.github+json', 'User-Agent': 'eeff-audit'}, method='POST')
          with urllib.request.urlopen(req, timeout=15) as response:
              print('Comentario del PR:', response.status)
          PYREPORT
      - name: Fallar si no coincide la muestra
        if: always() && steps.muestra.outcome != 'success'
        run: exit 1
