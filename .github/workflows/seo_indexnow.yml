name: SEO · IndexNow (indexación instantánea en Bing, Yandex, Naver)

# Cuando se publican datos nuevos bajo docs/outputs/ o data_manifest.json,
# notifica a IndexNow para que los buscadores participantes indexen el sitemap
# casi de inmediato, en lugar de esperar al próximo rastreo programado.
#
# IndexNow es gratuito y de código abierto. Soportado por Bing, Yandex, Naver y Seznam.
# Google no participa (usa su propio sistema vía Search Console, ya configurado).
#
# Requiere un secret del repositorio llamado INDEXNOW_KEY con la clave generada
# para este sitio. El archivo de verificación <clave>.txt debe estar en docs/.

on:
  push:
    branches:
      - main
    paths:
      - 'docs/outputs/**'
      - 'data_manifest.json'
      - 'docs/sitemap.xml'
      - '.github/workflows/seo_indexnow.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seo-indexnow
  cancel-in-progress: false

# Por qué `ubuntu-24.04` y no `ubuntu-latest`
#
# `ubuntu-latest` deja de ser Ubuntu 24.04 y pasa a 26.04 entre el 19 de octubre y el
# 19 de noviembre de 2026 (actions/runner-images#14748). Durante esas semanas la misma
# etiqueta da una imagen u otra sin aviso, así que un flujo puede pasar en una corrida y
# fallar en la siguiente sin que cambie una línea del repositorio. Es exactamente el patrón
# que se veía en las anotaciones: «The ubuntu-latest label will migrate to Ubuntu 26…».
#
# Estos flujos publican datos en `main`, así que un fallo intermitente no es solo ruido: deja
# la serie sin actualizar hasta la corrida siguiente (cada 3 días en la mayoría). Por eso la
# imagen se fija explícitamente. `contrato_publicado` y `seguros_carteras` ya lo hacían.
#
# Para probar Ubuntu 26 se cambia a `ubuntu-26.04` en una rama, no en `main`. Para volver a
# la etiqueta móvil hay que esperar al fin de la migración y correr la auditoría completa.

jobs:
  indexnow:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout de la rama
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Preparar Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Enviar sitemap a IndexNow
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: |
          python scripts/seo_indexnow_push.py
