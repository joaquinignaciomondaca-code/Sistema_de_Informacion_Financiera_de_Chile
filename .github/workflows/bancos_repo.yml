name: Actualización REPO Bancos CMF (incremental diaria)

on:
  workflow_dispatch:
  schedule:
    # Diario 11:00 UTC (1 hora posterior a macro, permitiendo cruce de TC)
    - cron: '0 11 * * *'

permissions:
  contents: read

concurrency:
  group: bancos-repo-update
  cancel-in-progress: false

jobs:
  update-repo:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: bancos/requirements.txt
      - name: Instalar dependencias bancarias
        run: |
          if [ -f bancos/requirements.txt ]; then
            python -m pip install -r bancos/requirements.txt
          else
            python -m pip install pandas pyarrow
          fi

      # Cada runner es efímero. Recuperar el último estado VALIDADO;
      # si el cache expiró, el script usa los Parquet publicados del checkout.
      - name: Recuperar checkpoint incremental REPO
        uses: actions/cache/restore@v4
        with:
          path: .local-data/checkpoint/bancos
          key: bancos-repo-checkpoint-${{ github.run_id }}
          restore-keys: |
            bancos-repo-checkpoint-

      - name: Descargar desde el último período CMF y auditar
        id: update
        env:
          CMF_API_KEY: ${{ secrets.CMF_API_KEY || secrets.PASSWORD_CMF || secrets.USER_CMF }}
          PASSWORD_CMF: ${{ secrets.PASSWORD_CMF }}
          USER_CMF: ${{ secrets.USER_CMF }}
        run: |
          test -n "$CMF_API_KEY" || { echo 'Falta secret CMF_API_KEY, PASSWORD_CMF o USER_CMF'; exit 1; }
          python -m bancos.scripts.daily_bancos_repo

      - name: Guardar checkpoint validado
        if: steps.update.outputs.checkpoint_changed == 'true'
        uses: actions/cache/save@v4
        with:
          path: .local-data/checkpoint/bancos
          key: bancos-repo-checkpoint-${{ github.run_id }}

      - name: Preparar paquete de datos para revisión humana
        if: steps.update.outputs.published_changed == 'true'
        run: |
          mkdir -p .local-data/review/docs/outputs/bancos
          cp docs/outputs/bancos/bancos_repos_saldos_series.* .local-data/review/docs/outputs/bancos/

      - name: Guardar resultado validado como artifact (sin commits automáticos)
        if: steps.update.outputs.published_changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: bancos-repo-validado
          path: .local-data/review/
          retention-days: 30
          if-no-files-found: error
