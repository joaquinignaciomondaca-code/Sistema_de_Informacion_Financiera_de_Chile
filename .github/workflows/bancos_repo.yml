# Cotejo de ZIP CMF: NO publica ni reemplaza el REPO existente.
name: Cotejo ZIP CMF — REPO bancario (sin publicación)

on:
  # Prueba de conectividad en la rama de sesión; sin publicar ni credenciales.
  push:
    branches: [arena/01a0e08b-monitor-financiero-chile]
    paths:
      - '.github/workflows/bancos_repo.yml'
      - 'bancos/scripts/**'
      - 'bancos/tests/**'
  workflow_dispatch:
    inputs:
      period:
        description: 'Mes puntual opcional AAAA-MM para calibración (ej. 2021-12)'
        required: false
        type: string
  schedule:
    - cron: '0 11 * * *'

permissions:
  contents: read

concurrency:
  group: bancos-repo-zip-probe
  cancel-in-progress: false

jobs:
  rebuild_review:
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.period) }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Reextraer historia B1 desde CMF sin publicar
        run: |
          mkdir -p .local-data/review/bancos/reconstruccion_cmf
          python -m bancos.scripts.rebuild_repo_from_cmf \
            > .local-data/review/bancos/reconstruccion_cmf/ejecucion.txt 2>&1 || {
              tail -n 30 .local-data/review/bancos/reconstruccion_cmf/ejecucion.txt
              exit 1
            }
          tail -n 30 .local-data/review/bancos/reconstruccion_cmf/ejecucion.txt
      - name: Mostrar totales y meses con diferencias sin depender del artefacto
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('.local-data/review/bancos/reconstruccion_cmf/resumen.json')
          if p.exists():
              doc = json.loads(p.read_text())
              print('::notice title=REPO B1 recálculo::' + json.dumps({
                  'meses': doc['meses_descargados'], 'esperados': len(doc['meses_solicitados']),
                  'totales': doc['totales'], 'errores': doc['errores'][:5],
                  'muestras_solo_cmf': [{'mes': r['periodo'], 'codigos': r['solo_cmf']}
                                       for r in doc['comparaciones'] if r.get('solo_cmf')][:5],
                  'muestras_diferencias': [{'mes': r['periodo'], 'valores': r['diferencias'][:2]}
                                          for r in doc['comparaciones'] if r.get('diferencias')][:5],
                  'codigos_cmf_fuera_legacy': doc['codigos_cmf_fuera_legacy'],
                  'control_total_sistema': {
                      'meses_diferencia': {s: sum(float(c[s]['diferencia_mm_clp']) != 0
                                                 for c in doc['conciliacion_total_sistema'])
                                           for s in ('activo', 'pasivo')},
                      'muestras': doc['conciliacion_total_sistema'][:3],
                      'codigos_muestras': [{
                          'mes': c['periodo'], 'filas': c.get('filas_no_cero', [])
                      } for c in doc['conciliacion_total_sistema'][:3]],
                  },
              }, ensure_ascii=False))
          PY
      - name: Conservar revisión temporal (nunca publicada)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repo-b1-reconstruccion-no-publicada
          path: .local-data/review/bancos/reconstruccion_cmf/
          retention-days: 30
          if-no-files-found: warn
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Recuperar avance del diagnóstico (sin datos publicados)
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.period) }}
        uses: actions/cache/restore@v4
        with:
          path: .local-data/checkpoint/bancos-repo-audit
          key: bancos-repo-audit-${{ github.run_id }}
          restore-keys: |
            bancos-repo-audit-
      - name: Cotejar balances B1/B2 de todos los bancos contra referencia REPO
        env:
          # Calibración histórica, cambio de plan y años recientes; nunca publica.
          PERIOD: ${{ github.event_name == 'push' && '2008-01 2014-12 2019-12 2020-12 2021-12 2022-01 2023-06 2024-12 2025-12 2026-04' || inputs.period }}
        run: |
          mkdir -p .local-data/review/bancos
          if [ -n "$PERIOD" ]; then
            for month in $PERIOD; do
              python -m bancos.scripts.audit_repos_zip_cmf --period "$month" \
                --report ".local-data/review/bancos/repo_zip_audit_$month.json" \
                >> .local-data/review/bancos/ejecucion.txt 2>&1 || {
                cat .local-data/review/bancos/ejecucion.txt
                echo "::error::$(tail -n 1 .local-data/review/bancos/ejecucion.txt)"
                exit 1
              }
            done
          else
            python -m bancos.scripts.audit_repos_zip_cmf > .local-data/review/bancos/ejecucion.txt 2>&1 || {
              cat .local-data/review/bancos/ejecucion.txt
              echo "::error::$(tail -n 1 .local-data/review/bancos/ejecucion.txt)"
              exit 1
            }
          fi
          cat .local-data/review/bancos/ejecucion.txt
      - name: Verificar disposición física de TXT B1 en muestras por vigencia
        if: ${{ github.event_name == 'push' }}
        run: |
          python -m bancos.scripts.inspect_repo_source_layout 2021-12 2022-06 2024-06 2024-07 2025-01 2026-04 \
            | tee .local-data/review/bancos/disposicion_b1.jsonl
          python - <<'PY'
          import json
          from pathlib import Path
          for line in Path('.local-data/review/bancos/disposicion_b1.jsonl').read_text().splitlines():
              doc = json.loads(line)
              for item in doc['archivos']:
                  if item['nombre'].lower().startswith('b1'):
                      print('::notice title=B1-layout::' + json.dumps({
                          'mes': doc['periodo'], 'sha_zip': doc['sha256'],
                          'archivo': item['nombre'], 'sha_txt': item['sha256'],
                          'primera': item['primeras_lineas'][:1],
                          'cuentas': item['filas_repo'], 'anchos': item['anchos_campos'],
                      }, ensure_ascii=False))
          PY
      - name: Guardar avance (solo si diagnóstico incremental completo)
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.period) }}
        uses: actions/cache/save@v4
        with:
          path: .local-data/checkpoint/bancos-repo-audit
          key: bancos-repo-audit-${{ github.run_id }}
      - name: Resumen de evidencia en la anotación del run (sin publicar)
        if: always()
        run: python -m bancos.scripts.summarize_repo_audit || true
      - name: Entregar diagnóstico para revisión humana
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cotejo-repo-zip-cmf
          path: .local-data/review/bancos/
          retention-days: 30
          if-no-files-found: warn
