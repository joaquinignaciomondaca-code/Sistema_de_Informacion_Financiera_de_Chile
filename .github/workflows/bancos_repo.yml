# Solo diagnóstico de ZIP CMF: NO publica ni reemplaza el REPO existente.
name: Diagnóstico ZIP CMF — REPO bancario (sin publicación)

on:
  workflow_dispatch:
    inputs:
      period:
        description: 'Mes puntual opcional AAAA-MM para calibración (ej. 2021-12)'
        required: false
        type: string
  schedule:
    - cron: '0 11 * * *'

permissions:
  contents: read

concurrency:
  group: bancos-repo-zip-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Recuperar avance del diagnóstico (sin datos publicados)
        if: ${{ !inputs.period }}
        uses: actions/cache/restore@v4
        with:
          path: .local-data/checkpoint/bancos-repo-probe
          key: bancos-repo-probe-${{ github.run_id }}
          restore-keys: |
            bancos-repo-probe-
      - name: Inspeccionar ZIP públicos de CMF
        env:
          PERIOD: ${{ inputs.period }}
        run: |
          if [ -n "$PERIOD" ]; then
            python -m bancos.scripts.probe_repos_zip_cmf --period "$PERIOD"
          else
            python -m bancos.scripts.probe_repos_zip_cmf
          fi
      - name: Guardar avance (solo si diagnóstico incremental completo)
        if: ${{ !inputs.period }}
        uses: actions/cache/save@v4
        with:
          path: .local-data/checkpoint/bancos-repo-probe
          key: bancos-repo-probe-${{ github.run_id }}
      - name: Entregar diagnóstico para revisión humana
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico-repo-zip-cmf
          path: .local-data/review/bancos/repo_zip_probe.json
          retention-days: 30
          if-no-files-found: error
