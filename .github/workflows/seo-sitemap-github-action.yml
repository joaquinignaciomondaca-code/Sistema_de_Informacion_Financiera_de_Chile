name: SEO · Sitemap automático (GitHub Action gratuita)

# Regenera metadatos, robots.txt y sitemap desde el catálogo fuente del
# repositorio. Así se excluyen páginas noindex y archivos de verificación, y
# las URLs del sitemap coinciden con los canonicals. Se ejecuta diario y bajo
# demanda (workflow_dispatch); si hay cambios, los publica en main.

on:
  schedule:
    - cron: '0 4 * * *'  # diario 04:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: seo-sitemap-action
  cancel-in-progress: false

# Por qué `ubuntu-24.04` y no `ubuntu-latest`
#
# `ubuntu-latest` deja de ser Ubuntu 24.04 y pasa a 26.04 entre el 19 de octubre y el
# 19 de noviembre de 2026 (actions/runner-images#14748). Durante esas semanas la misma
# etiqueta da una imagen u otra sin aviso, así que un flujo puede pasar en una corrida y
# fallar en la siguiente sin que cambie una línea del repositorio. Es exactamente el patrón
# que se veía en las anotaciones: «The ubuntu-latest label will migrate to Ubuntu 26…».
#
# Estos flujos publican datos en `main`, así que un fallo intermitente no es solo ruido: deja
# la serie sin actualizar hasta la corrida siguiente (cada 3 días en la mayoría). Por eso la
# imagen se fija explícitamente. `contrato_publicado` y `seguros_carteras` ya lo hacían.
#
# Para probar Ubuntu 26 se cambia a `ubuntu-26.04` en una rama, no en `main`. Para volver a
# la etiqueta móvil hay que esperar al fin de la migración y correr la auditoría completa.

jobs:
  sitemap:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout de la rama
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Preparar Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Regenerar metadatos y sitemap desde el catálogo
        run: python scripts/build_metadatos.py

      # Comprobación estructural del sitemap antes de escribir: XML bien
      # formado, namespace oficial, URLs del sitio y sin duplicados.
      - name: 'Compuerta: el sitemap generado es XML válido y coherente'
        run: python -m unittest -v scripts.test_sitemap_workflow

      - name: Commit y push si hay cambios
        run: |
          git config user.name "joaquinignaciomondaca-code"
          git config user.email "234955610+joaquinignaciomondaca-code@users.noreply.github.com"
          # Las páginas HTML son archivos compartidos y se regeneran en la cadena de
          # contrato sobre la cabeza vigente. Este workflow sólo publica sus índices.
          git add docs/robots.txt docs/sitemap.xml docs/opensearch.xml
          if git diff --cached --quiet; then
            echo "Sitemap sin cambios; no hay nada que commitear."
            exit 0
          fi
          git commit -m "SEO: metadatos y sitemap regenerados desde el catálogo"
          # Un push a `main` desde acá compete con los publicadores (cada ~3 días) y con
          # `pages.yml` (03:15, 45 minutos antes de este flujo): si alguien publicó en el
          # medio, el push se rechaza. Antes se hacía un único intento y la corrida quedaba
          # en rojo sin publicar el sitemap; el 2026-11-02 pasó exactamente eso. Como el
          # sitemap se regenera entero a partir de la cabeza, basta con rebasar y reintentar
          # (es un archivo generado: se resuelve tomando el del commit, no mezclando).
          for intento in 1 2 3 4 5; do
            git fetch origin "${GITHUB_REF_NAME:-main}"
            if ! git rebase FETCH_HEAD; then
              git rebase --abort 2>/dev/null || true
              git reset --hard FETCH_HEAD
              git add docs/robots.txt docs/sitemap.xml docs/opensearch.xml
              git diff --cached --quiet || git commit -m "SEO: metadatos y sitemap regenerados desde el catálogo"
            fi
            if git push origin "HEAD:${GITHUB_REF_NAME:-main}"; then
              echo "Sitemap publicado (intento ${intento}/5)."
              exit 0
            fi
            echo "Push rechazado (intento ${intento}/5): otra corrida publicó primero."
            sleep $(( 10 + RANDOM % 20 ))
          done
          echo "::error title=Sitemap::No se pudo publicar el sitemap tras 5 intentos por contención en la rama"
          exit 1
