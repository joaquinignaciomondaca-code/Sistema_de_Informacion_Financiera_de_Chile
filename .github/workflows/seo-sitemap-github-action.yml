name: SEO · Sitemap automático (GitHub Action gratuita)

# Usa la acción comunitaria cicirello/generate-sitemap (MIT License) para
# regenerar el sitemap.xml desde el sitio publicado en GitHub Pages.
# Se ejecuta diario y bajo demanda (workflow_dispatch). Complementa al script
# local scripts/build_metadatos.py; si hay cambios, los commitea en main.

on:
  schedule:
    - cron: '0 4 * * *'  # diario 04:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: seo-sitemap-action
  cancel-in-progress: false

# Por qué `ubuntu-24.04` y no `ubuntu-latest`
#
# `ubuntu-latest` deja de ser Ubuntu 24.04 y pasa a 26.04 entre el 19 de octubre y el
# 19 de noviembre de 2026 (actions/runner-images#14748). Durante esas semanas la misma
# etiqueta da una imagen u otra sin aviso, así que un flujo puede pasar en una corrida y
# fallar en la siguiente sin que cambie una línea del repositorio. Es exactamente el patrón
# que se veía en las anotaciones: «The ubuntu-latest label will migrate to Ubuntu 26…».
#
# Estos flujos publican datos en `main`, así que un fallo intermitente no es solo ruido: deja
# la serie sin actualizar hasta la corrida siguiente (cada 3 días en la mayoría). Por eso la
# imagen se fija explícitamente. `contrato_publicado` y `seguros_carteras` ya lo hacían.
#
# Para probar Ubuntu 26 se cambia a `ubuntu-26.04` en una rama, no en `main`. Para volver a
# la etiqueta móvil hay que esperar al fin de la migración y correr la auditoría completa.

jobs:
  sitemap:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout de la rama
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Python (stdlib del test, sin dependencias)
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Generar sitemap XML con cicirello/generate-sitemap
        uses: cicirello/generate-sitemap@v1
        with:
          base-url-path: https://joaquinignaciomondaca-code.github.io/Sistema_de_Informacion_Financiera_de_Chile/
          output-path: docs/sitemap.xml
          exclude: 'docs/.well-known/ docs/notas/'

      # Compuerta de la guardia test_contrato_publicadores: un workflow que
      # commitea en la rama debe probarse a sí mismo (en schedule no corre
      # web_audit). El sitemap que produce la acción es validado antes de
      # escribir: bien formado, namespace oficial, locs del sitio publicado
      # y sin duplicados o carpetas excluidas.
      - name: 'Compuerta: el sitemap generado es XML válido y coherente'
        run: python -m unittest -v scripts.test_sitemap_workflow

      - name: Commit y push si hay cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/sitemap.xml
          if ! git diff --cached --quiet; then
            git commit -m "SEO: sitemap.xml actualizado automáticamente (cicirello/generate-sitemap)"
            git push origin HEAD:main
          else
            echo "Sitemap sin cambios; no hay nada que commitear."
          fi
