name: Sonda temporal FFMM carteras
on:
  push:
    branches: [arena/01a0e680-monitor-financiero-chile]
    paths: [.github/workflows/ffmm_sonda.yml]
permissions:
  contents: write
jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.ref_name }}'}
      - run: |
          mkdir -p ffmm/sonda
          U=https://www.cmfchile.cl/institucional/estadisticas
          curl -sk -A "Mozilla/5.0" "$U/ffm_cartera.php" -o /tmp/p.html
          grep -io '<option[^>]*value="[^"]*"[^>]*>[^<]*' /tmp/p.html | tail -12 > ffmm/sonda/opciones.txt
          grep -io '<form[^>]*>' /tmp/p.html >> ffmm/sonda/opciones.txt
          cat ffmm/sonda/opciones.txt
          for c in $(grep -io 'value="[A-Z]\{3,5\}"' /tmp/p.html | sed 's/value="//I;s/"//' | sort -u); do
            for p in "2026 07" "2016 06" "2005 06"; do set -- $p
              curl -sk -A "Mozilla/5.0" -e "$U/ffm_cartera.php" -d "aa=$1&mm=$2&cartera=$c&btnConsulta=GENERAR+ARCHIVO" "$U/ffm_download.php" -o /tmp/f.txt
              n=$(wc -l < /tmp/f.txt); b=$(wc -c < /tmp/f.txt)
              echo "$c $1$2 lineas=$n bytes=$b" | tee -a ffmm/sonda/resumen.txt
              head -4 /tmp/f.txt > "ffmm/sonda/${c}_$1$2.txt"
            done
          done
      - run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ffmm/sonda && git commit -m "Sonda FFMM carteras" && git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME"
