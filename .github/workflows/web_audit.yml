name: Auditoría de la web (catálogo vs Parquet) y de la automatización

# Comprueba que el explorador, el visor, el diccionario y el ERD apunten a
# Parquet reales y a vistas semánticas registradas en duckdb_client.js.
# Los resultados se publican como anotaciones (los logs de Actions no se
# pueden descargar desde el entorno de trabajo).
#
# Compuerta de diseño (paso «Diseño: anti-patrones de interfaz»): el detector
# determinista de Impeccable corre sobre docs/ sin LLM ni API key. El sitio está
# hoy en cero hallazgos, así que cualquier hallazgo nuevo falla el paso. La
# versión del detector va fijada para que una regla nueva no aparezca sola.
# Contexto y criterios: docs/notas/diseno_detector_2026-10-21.md.
#
# Guardián de automatización (scripts/audit_automatizacion.py, inventario en
# pipelines/auto/inventario.json):
#   * en cada push: toda tabla de data_manifest.json debe tener un workflow con horario que
#     la escriba, o un motivo explícito de por qué es manual. Una tabla nueva sin eso falla.
#   * cada lunes: cada workflow del inventario debe haber corrido con éxito en la rama por
#     defecto dentro de su plazo; si no, se abre (o comenta) un issue.
on:
  schedule:
    - cron: '0 14 * * 1'

  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'scripts/audit_*.py'
      - 'scripts/audit_*.js'
      - 'scripts/lib/**'
      - 'scripts/test_busqueda.js'
      - 'scripts/test_busqueda_dom.js'
      - 'scripts/generar_indice_busqueda.py'
      - 'scripts/test_generar_indice_busqueda.py'
      - 'scripts/build_metricas_publicadas.py'
      - 'scripts/build_indice_notas.py'
      - 'scripts/test_build_indice_notas.py'
      - 'scripts/build_ficha_piloto.py'
      - 'scripts/build_api.py'
      - 'scripts/ficha_renderer.py'
      - 'scripts/test_fichas_candidatas.py'
      - 'scripts/test_fichas_sql_local.py'
      - 'scripts/test_ficha_piloto_http.py'
      - 'scripts/probar_ejemplos.py'
      - 'scripts/test_contrato.py'
      - 'scripts/auditar_mcp.py'
      - 'sdk/**'
      - 'examples/**'
      - 'scripts/normalizar_vocabulario.py'
      - 'scripts/build_download_catalog.py'
      - 'scripts/build_bancos_vistas.py'
      - 'scripts/build_sql_compact_parquets.py'
      - 'scripts/test_sql_compact_parquets.py'
      - 'pipelines/**'
      - 'factoring_leasing/**'
      - 'bancos/**'
      - 'corredoras_bolsa/**'
      - 'ffmm/**'
      - '.github/workflows/**'
      - 'data_manifest.json'

  # Antes esto listaba una rama de trabajo concreta, que quedaba obsoleta en cada
  # sesión. Con pull_request, cualquier rama que proponga cambios a main se audita.
  pull_request:
    branches: [main]

  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    # La cadena completa (historial, Parquet, contrato, IFRS y DOM) superó el
    # límite anterior de 20 minutos antes de poder terminar; deja margen para
    # que el job alcance todas las compuertas en vez de cancelarse a mitad.
    timeout-minutes: 30
    steps:
      # fetch-depth: 0 trae el historial completo: la auditoría de credenciales
      # revisa todos los blobs, no sólo el commit actual.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 'Contrato: manifiesto ETL, API y descargas comparten métricas'
        run: python scripts/build_metricas_publicadas.py --check
      - name: 'Capacidad: tamaño publicado, inventario y presupuesto de transferencia'
        run: python scripts/audit_pages_capacity.py
      - name: 'Ficha piloto: metadatos, procedencia, esquema y acciones relativas'
        run: python scripts/build_ficha_piloto.py --check
      - name: 'Ficha piloto: ruta, semántica, contraste y enlaces en ambos prefijos'
        run: python scripts/test_ficha_piloto_http.py
      - name: 'Fichas candidatas: contrato, acciones, enlaces y previsualización sin publicar'
        run: python scripts/test_fichas_candidatas.py
      - name: 'Búsqueda: metadatos alineados, índice sincronizado y ranking'
        run: |
          python -m unittest scripts.test_generar_indice_busqueda -v
          python scripts/generar_indice_busqueda.py --check
          node scripts/test_busqueda.js
      - run: python -m pip install --disable-pip-version-check pyarrow==21.0.0

      - name: Caché del detector de diseño
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/.impeccable/bin
          key: impeccable-4.7.0

      # Compuerta de diseño: 61 reglas deterministas sobre docs/ (sin LLM ni API key).
      # Hoy está en cero hallazgos, así que cualquier hallazgo nuevo falla el paso.
      # La versión va fijada a propósito: el detector es determinista y así una regla
      # nueva no puede aparecer en un push sin que alguien suba esta línea a mano.
      # --github no emite anotaciones en la 4.7.0 (probado con GITHUB_ACTIONS=true),
      # así que se generan desde el JSON. GitHub muestra 10 anotaciones de cada tipo
      # por paso; el resto queda en el log y se resume en el ::notice final.
      - name: 'Diseño: anti-patrones de interfaz (detector determinista)'
        run: |
          set +e
          # Una ruta inexistente no es un error para el detector: devuelve 0 con cero
          # archivos escaneados. Sin esta comprobación, mover o renombrar docs/ apagaría
          # la compuerta en silencio.
          for objetivo in docs/index.html docs/css/app.css; do
            if [ ! -f "$objetivo" ]; then
              echo "::error title=Diseño::falta $objetivo; el detector no tendría qué escanear"
              exit 1
            fi
          done
          # Los artefactos van al directorio temporal del runner, no a la raíz del
          # repositorio (donde quedarían como archivos sin versionar).
          export SALIDA="${RUNNER_TEMP:-/tmp}/diseno"
          correr() {
            DO_NOT_TRACK=1 IMPECCABLE_NO_TELEMETRY=1 \
              npx -y impeccable@4.7.0 detect --no-config --json docs/ > "$SALIDA.json" 2> "$SALIDA.log"
          }
          correr; n=$?
          # 1 = no pudo escanear (red, binario). Un fallo de infraestructura no debe
          # confundirse con un hallazgo: se reintenta una vez y, si persiste, falla
          # con mensaje explícito en vez de dejar la compuerta apagada en silencio.
          if [ $n -eq 1 ]; then
            echo "::warning title=Diseño::el detector no pudo escanear (reintentando una vez)"
            sleep 5
            correr; n=$?
          fi
          if [ $n -eq 1 ]; then
            tail -n 3 "$SALIDA.log" | sed 's/%/%25/g' | while IFS= read -r l; do echo "::error title=Diseño:::$l"; done
            exit 1
          fi
          node -e '
            const fs = require("fs");
            const raiz = (process.env.GITHUB_WORKSPACE || "") + "/";
            const hallazgos = JSON.parse(fs.readFileSync(process.env.SALIDA + ".json", "utf8"));
            for (const h of hallazgos.slice(0, 10)) {
              const archivo = String(h.file).replace(raiz, "");
              const donde = h.line > 0 ? ` file=${archivo},line=${h.line}` : ` file=${archivo}`;
              const texto = `${h.antipattern}: ${h.snippet || ""}`.replace(/%/g, "%25");
              console.log(`::error title=Diseño ${h.antipattern}${donde}::${texto}`);
            }
            const resumen = `${hallazgos.length} hallazgo(s) en docs/ · reglas y guía en docs/notas/diseno_detector_2026-10-21.md`;
            console.log(hallazgos.length ? `::error title=Diseño::${resumen}` : `::notice title=Diseño::${resumen}`);
          '
          # Un JSON ilegible no debe confundirse con "sin hallazgos": si node falla,
          # el paso falla aunque el detector haya salido con 0.
          leible=$?
          if [ $leible -ne 0 ]; then
            echo "::error title=Diseño::no se pudo leer el JSON del detector"
            tail -n 3 "$SALIDA.log" | sed 's/%/%25/g' | while IFS= read -r l; do echo "::error title=Diseño:::$l"; done
            exit 1
          fi
          exit $n

      - name: El motor DuckDB vendorizado es el que se revisó (huellas)
        run: |
          set +e
          python scripts/audit_vendor_duckdb.py > motor.log 2>&1; n=$?
          grep -h "^FALLA" motor.log | head -10 | sed 's/%/%25/g' | while IFS= read -r l; do echo "::error title=Motor DuckDB::$l"; done
          echo "::notice title=Motor DuckDB::$(tail -n 1 motor.log)"
          exit $n

      - name: Auditar navegación y catálogo web
        run: |
          set +e
          python scripts/audit_navigation.py > nav.log 2>&1; n1=$?
          python scripts/audit_web_full.py > web.log 2>&1; n2=$?
          grep -h -E "^(Error|Inconsistencia|Advertencia)|AssertionError" nav.log web.log | head -10 | sed 's/%/%25/g' | while IFS= read -r linea; do echo "::error title=Auditoria web::$linea"; done
          tail -n 3 nav.log web.log | sed 's/%/%25/g' | while IFS= read -r linea; do echo "::warning title=Auditoria web (cola)::$linea"; done
          echo "::notice title=Auditoria web::navigation=$n1 audit_full=$n2 (0 = sin hallazgos)"
          exit $(( n1 || n2 ))

      - name: 'Fuentes web: diccionario alineado con el catálogo API'
        run: node scripts/audit_fuentes_publicadas.js --autoprueba

      - name: 'Unidad de observación: inventario explícito sin inferencias'
        run: node scripts/audit_unidad_observacion.js --autoprueba

      # El aviso de privacidad describe qué se publica y qué se suprime. Esta
      # compuerta lo contrasta con los Parquet servidos —no con el pipeline— y con
      # las cifras escritas en PRIVACIDAD.md, para que la descripción no se separe
      # de lo publicado. Corre antes del contrato por la misma razón que la de
      # móvil: una compuerta que no llega a ejecutarse no informa.
      - name: 'Privacidad: el aviso coincide con los archivos publicados'
        run: |
          set +e
          python -m pip install --disable-pip-version-check duckdb >/dev/null 2>&1
          python scripts/auditar_personas_publicadas.py > personas.log 2>&1; n=$?
          grep -h "^\[FALLA\]" personas.log | head -10 | sed 's/%/%25/g' \
            | while IFS= read -r l; do echo "::error title=Privacidad::$l"; done
          echo "::notice title=Privacidad::$(tail -n 1 personas.log)"
          exit $n

      # El teléfono es la pantalla más común y la única que no se puede revisar
      # a ojo en este entorno: no hay navegador en el runner. Estas dos compuertas
      # convierten la ruta de `docs/notas/ruta_movil_2026-10-22.md` en reglas que
      # se ejecutan solas. La primera lee CSS, marcado y eventos; la segunda, con
      # jsdom, toca el cajón del explorador y el aviso de uso.
      - name: Auditar la interfaz en pantalla pequeña
        run: |
          set +e
          # jsdom se instala aquí y no se hereda de un paso posterior: así esta
          # compuerta corre aunque antes haya fallado otra.
          npm install --no-save --no-audit --no-fund jsdom >/dev/null 2>&1
          python scripts/audit_movil.py --autoprueba > movil_auto.log 2>&1; n0=$?
          python scripts/audit_movil.py > movil.log 2>&1; n=$?
          node scripts/audit_movil_dom.js > movil_dom.log 2>&1; n2=$?
          grep -h -E "^(FALLA|\[FALLA\])" movil_auto.log movil.log movil_dom.log | head -12 \
            | sed 's/%/%25/g' | while IFS= read -r linea; do echo "::error title=Móvil::$linea"; done
          echo "::notice title=Móvil::$(tail -n 1 movil.log)"
          echo "::notice title=Móvil (cajón)::$(tail -n 1 movil_dom.log)"
          exit $(( n0 || n || n2 ))

      - name: Auditar interfaz, vocabulario y catálogo de descargas
        run: |
          set +e
          python scripts/audit_interfaz.py > interfaz.log 2>&1; n=$?
          grep -h -E "^(Error|Inconsistencia|Advertencia)|^  - " interfaz.log | head -10 | sed 's/%/%25/g' | while IFS= read -r linea; do echo "::error title=Interfaz::$linea"; done
          echo "::notice title=Interfaz::$(tail -n 2 interfaz.log | head -1)"
          exit $n

      - name: Auditor de formatos de RUT (guardián de la convención)
        run: |
          set +e
          python scripts/audit_rut_formatos.py > rut.log 2>&1; n=$?
          grep -h "^Error" rut.log | head -20 | sed 's/%/%25/g' | while IFS= read -r linea; do echo "::error title=RUT::$linea"; done
          echo "::notice title=RUT::$(tail -n 1 rut.log)"
          exit $n

      # El diccionario de seguros se genera desde las fichas de la CMF y se sirve
      # en docs/js. Si alguien cambia la fuente (o las fichas) y no regenera, el
      # flujo de seguros falla recién en su próximo disparo —que puede ser en tres
      # días— y el publicador se queda sin correr. Esto lo detecta en el PR.
      - name: 'Diccionarios de seguros al día: fichas de la CMF → docs/js'
        run: |
          set +e
          python -m seguros.scripts.diccionario_1835 --check > diccionario.log 2>&1; n=$?
          if [ "$n" -ne 0 ]; then
            grep -h -E "DESACTUALIZADO|Ejecuta" diccionario.log | head -6 | sed 's/%/%25/g' | while IFS= read -r l; do echo "::error title=Diccionarios::$l"; done
          fi
          echo "::notice title=Diccionarios::$(tail -n 1 diccionario.log)"
          exit $n

      - name: 'Banca: Parquet de descarga coinciden con filtros y manifiestos'
        run: python scripts/build_bancos_vistas.py --check

      - name: 'SQL: pruebas y Parquet compactos sincronizados con las particiones'
        run: |
          python -m unittest scripts.test_sql_compact_parquets -v
          python scripts/build_sql_compact_parquets.py --check

      - name: Auditar las consultas sugeridas contra los Parquet
        run: |
          python -m pip install --disable-pip-version-check duckdb
          set +e
          python scripts/audit_consultas_sugeridas.py --check > consultas.log 2>&1; n=$?
          grep -h -E "^(FALLA|  ·)" consultas.log | head -10 | sed 's/%/%25/g' | while IFS= read -r linea; do echo "::error title=Consultas sugeridas::$linea"; done
          grep -h -E "Consultas sugeridas|OK|VACIA|ERROR" consultas.log | sed 's/%/%25/g' | while IFS= read -r linea; do echo "::notice title=Consultas sugeridas::$linea"; done
          exit $n

      - name: 'Fichas: las consultas expuestas ejecutan en DuckDB local y respetan filtros'
        run: python scripts/test_fichas_sql_local.py

      # La sección de Banca fue la única que llegó al sitio con la ficha «Falta
      # validar»: el catálogo de instituciones no tenía cotejo reproducible y los
      # importes fuente se publicaban como texto de 15 dígitos. Estas tres
      # compuertas cierran eso: los RUT cuadran con el registro de la CMF, el
      # maestro tiene un solo formato de RUT y cada fila trae su importe en pesos.
      - name: 'Banca: identidades cotejadas e importes normalizados'
        run: |
          set +e
          python bancos/scripts/validar_identidades.py --check > identidades.log 2>&1; i=$?
          python bancos/scripts/corregir_identidades.py --check > maestro_bancos.log 2>&1; c=$?
          python bancos/scripts/normalizar_importes.py --check > importes_bancos.log 2>&1; n=$?
          for par in "Identidades Banca:identidades.log:$i" "Maestro Banca:maestro_bancos.log:$c" "Importes Banca:importes_bancos.log:$n"; do
            nombre=${par%%:*}; resto=${par#*:}; archivo=${resto%%:*}; codigo=${resto##*:}
            if [ "$codigo" -eq 0 ]; then
              echo "::notice title=$nombre::$(tail -n 1 "$archivo")"
            else
              grep -h -E "^(BANCA|FALLA|  ·)" "$archivo" | head -8 | sed 's/%/%25/g' | while IFS= read -r l; do echo "::error title=$nombre::$l"; done
              echo "::error title=$nombre::falló (código $codigo)"
            fi
          done
          exit $(( i | c | n ))

      - name: 'Contrato de la API: reconciliación y esquemas al día'
        run: |
          set +e
          python scripts/build_reconciliacion.py --check > recon.log 2>&1; r=$?
          cat recon.log
          python scripts/build_esquemas.py --check > esquemas.log 2>&1; e=$?
          cat esquemas.log
          exit $(( r | e ))

      - name: 'Claves y Data Package: PK verificadas, FK medidas y descriptor válido'
        run: |
          # frictionless abre Parquet a través de pandas; sin él la muestra no corre.
          python -m pip install --disable-pip-version-check frictionless pandas
          python -c "import duckdb, pyarrow, frictionless; print('duckdb', duckdb.__version__, '· pyarrow', pyarrow.__version__, '· frictionless', frictionless.__version__)"
          set +e
          python scripts/verificar_claves.py --check > claves.log 2>&1; c=$?
          python scripts/build_api.py --check > api.log 2>&1; a=$?
          python scripts/auditar_datapackage.py --check > dp.log 2>&1; d=$?
          # Los logs del runner no siempre se pueden recuperar desde fuera, así
          # que el detalle se imprime aquí.
          for par in "Claves:claves.log:$c" "Data Package:api.log:$a" "Auditoría:dp.log:$d"; do
            nombre=${par%%:*}; resto=${par#*:}; archivo=${resto%%:*}; codigo=${resto##*:}
            if [ "$codigo" -eq 0 ]; then echo "::notice title=$nombre::$(tail -n 2 "$archivo" | head -1)"
            else
              # La anotación es lo único que se puede leer desde fuera del runner.
              grep -h "\[FALLA\]\|ERROR" "$archivo" | head -6 | sed 's/%/%25/g' | while IFS= read -r l; do echo "::error title=$nombre::$l"; done
              echo "::error title=$nombre::falló (código $codigo)"
            fi
          done
          exit $(( c | a | d ))

      - name: 'Vitrina: metadatos sociales, robots y sitemap derivados del catálogo'
        run: |
          set +e
          python scripts/build_metadatos.py --check > vitrina.log 2>&1; v=$?
          cat vitrina.log
          if [ "$v" -ne 0 ]; then
            echo "::error title=Vitrina::index.html, robots.txt o sitemap.xml no coinciden con el catálogo publicado"
          else
            echo "::notice title=Vitrina::$(tail -n 1 vitrina.log)"
          fi
          exit $v

      - name: 'Diccionario: el estado de las claves se deriva de claves.csv'
        run: |
          set +e
          python scripts/build_estado_claves.py --check > estado_claves.log 2>&1; n=$?
          cat estado_claves.log
          if [ "$n" -ne 0 ]; then
            echo "::error title=Diccionario::estado_claves.js no coincide con claves.csv; ejecuta scripts/build_estado_claves.py"
          else
            echo "::notice title=Diccionario::$(tail -n 1 estado_claves.log)"
          fi
          exit $n

      - name: 'Claves: la búsqueda no puede inventar una clave única (autoprueba)'
        run: |
          python -m pip install --disable-pip-version-check duckdb >/dev/null 2>&1
          python -m unittest -v pipelines.auto.tests.test_claves

      - name: 'RUT: regresiones de transformación de nro_rut y preservación de otros campos'
        run: python -m unittest -v pipelines.auto.tests.test_rut_nro_rut

      - name: 'Contrato estático: catálogo, esquemas, particiones, consultas, OpenAPI y vistas'
        run: |
          set +e
          python scripts/build_contrato.py --check > contrato.log 2>&1; c=$?
          python scripts/auditar_contrato.py --check > contrato_audit.log 2>&1; a=$?
          for par in "Contrato:contrato.log:$c" "Contrato (auditoría):contrato_audit.log:$a"; do
            nombre=${par%%:*}; resto=${par#*:}; archivo=${resto%%:*}; codigo=${resto##*:}
            if [ "$codigo" -eq 0 ]; then echo "::notice title=$nombre::$(tail -n 1 "$archivo")"
            else
              grep -h "\[FALLA\]\|CONTRATO" "$archivo" | head -8 | sed 's/%/%25/g' | while IFS= read -r l; do echo "::error title=$nombre::$l"; done
            fi
          done
          exit $(( c | a ))

      - name: 'Columnas publicadas: el archivo descargable no lleva columnas internas'
        run: |
          # `pipelines/esquema_publicado.py` fija qué columnas viajan en el Parquet.
          # Las de control (huellas, rutas de origen, claves sintéticas) se siguen
          # calculando para verificar, pero no se publican.
          set +e
          python scripts/verificar_columnas_publicadas.py --check > columnas.log 2>&1; c=$?
          cat columnas.log
          if [ "$c" -ne 0 ]; then
            grep -h "\[FALLA\]" columnas.log | head -6 | sed 's/%/%25/g' | while IFS= read -r l; do echo "::error title=Columnas publicadas::$l"; done
          fi
          exit $c

      - name: 'Resultados precalculados: las 159 consultas con su JSON al día (fase 3)'
        run: |
          set +e
          python scripts/build_resultados.py --check > resultados.log 2>&1; n=$?
          if [ "$n" -eq 0 ]; then
            echo "::notice title=Resultados::$(grep -h '^RESULTADOS' resultados.log)"
          else
            grep -h '\[FALLA\]\|RESULTADOS' resultados.log | head -8 | sed 's/%/%25/g' | while IFS= read -r l; do echo "::error title=Resultados::$l"; done
          fi
          exit $n

      - name: 'Test de contrato: rutas, esquemas, vistas, consultas, hashes y cobertura (y autoprueba)'
        run: |
          set +e
          python scripts/test_contrato.py --check --autoprueba > contrato_test.log 2>&1; n=$?
          grep -h -E "^(OK|FALLA|AVISO)" contrato_test.log | sed 's/%/%25/g' | while IFS= read -r l; do echo "::notice title=Test de contrato::$l"; done
          if [ "$n" -ne 0 ]; then
            grep -h "^FALLA" contrato_test.log | head -8 | sed 's/%/%25/g' | while IFS= read -r l; do echo "::error title=Test de contrato::$l"; done
          fi
          exit $n

      - name: 'Máquina limpia: un consumidor sin el repo descubre, lee el esquema y consulta'
        run: |
          set +e
          python scripts/probar_maquina_limpia.py --check > limpia.log 2>&1; n=$?
          grep -E "^(OK|FALLA|MÁQUINA|Duración|  \[FALLA\])" limpia.log | sed 's/%/%25/g' | while IFS= read -r l; do echo "::notice title=Máquina limpia::$l"; done
          [ "$n" -ne 0 ] && echo "::error title=Máquina limpia::falló (ver docs/api/prueba_maquina_limpia.log)"
          exit $n

      - name: 'SDK de Python: se instala en limpio y pasa sus tests sin red'
        run: |
          set +e
          python -m pip install --disable-pip-version-check -e sdk/python > sdk.log 2>&1; i=$?
          python -m unittest discover -s sdk/python/tests -t sdk/python >> sdk.log 2>&1; t=$?
          if [ "$i" -ne 0 ]; then
            grep -h -E "ERROR|error:" sdk.log | head -5 | sed 's/%/%25/g' | while IFS= read -r l; do echo "::error title=SDK de Python::$l"; done
          fi
          if [ "$t" -eq 0 ]; then
            echo "::notice title=SDK de Python::$(grep -E '^(OK|Ran )' sdk.log | tr '\n' ' ')"
          else
            grep -h -E "^(FAIL|ERROR):" sdk.log | head -5 | sed 's/%/%25/g' | while IFS= read -r l; do echo "::error title=SDK de Python::$l"; done
          fi
          exit $(( i | t ))

      - name: 'Servidor MCP: dos herramientas, presupuesto de contexto y la pregunta del README'
        run: |
          python -m pip install --disable-pip-version-check "mcp>=2"
          set +e
          python scripts/auditar_mcp.py --check > mcp.log 2>&1; n=$?
          grep -h -E "^(OK|FALLA)" mcp.log | sed 's/%/%25/g' | while IFS= read -r l; do echo "::notice title=MCP::$l"; done
          if [ "$n" -ne 0 ]; then
            grep -h -E "^(FALLA|\[FALLA\])" mcp.log | head -6 | sed 's/%/%25/g' | while IFS= read -r l; do echo "::error title=MCP::$l"; done
          fi
          exit $n

      - name: 'Ejemplos reproducibles: Python sin red y JavaScript con fetch'
        run: |
          set +e
          python scripts/probar_ejemplos.py --check > ejemplos.log 2>&1; n=$?
          grep -h -E "^(OK|FALLA|EJEMPLOS)" ejemplos.log | sed 's/%/%25/g' | while IFS= read -r l; do echo "::notice title=Ejemplos::$l"; done
          if [ "$n" -ne 0 ]; then
            grep -h "^      " ejemplos.log | head -6 | sed 's/%/%25/g' | while IFS= read -r l; do echo "::error title=Ejemplos::$l"; done
          fi
          exit $n

      - name: Prueba del cliente DuckDB (registro de vistas sin navegador)
        run: |
          set +e
          node scripts/audit_duckdb_client.js > cliente.log 2>&1; n=$?
          grep -h "^FALLA" cliente.log | head -10 | sed 's/%/%25/g' | while IFS= read -r linea; do echo "::error title=Cliente DuckDB::$linea"; done
          echo "::notice title=Cliente DuckDB::$(tail -n 1 cliente.log)"
          exit $n

      - name: El motor DuckDB no arranca al cargar (bajo demanda)
        run: |
          set +e
          node scripts/audit_arranque_motor.js > arranque.log 2>&1; n=$?
          grep -h "^FALLA" arranque.log | head -10 | sed 's/%/%25/g' | while IFS= read -r linea; do echo "::error title=Arranque del motor::$linea"; done
          echo "::notice title=Arranque del motor::$(tail -n 1 arranque.log)"
          exit $n

      - name: La consola SQL es de solo lectura (guardia)
        run: |
          set +e
          node scripts/audit_sql_guard.js > guardia.log 2>&1; n=$?
          grep -h "^FALLA" guardia.log | head -10 | sed 's/%/%25/g' | while IFS= read -r linea; do echo "::error title=Guardia SQL::$linea"; done
          echo "::notice title=Guardia SQL::$(tail -n 1 guardia.log)"
          exit $n

      - name: 'Estados financieros IFRS publicados: cuadratura sobre toda la historia'
        run: |
          python -m pip install --disable-pip-version-check pandas==2.2.3 pyarrow==21.0.0
          set +e
          python scripts/auditar_eeff_ifrs.py > eeff.log 2>&1; n=$?
          grep -h -E "^(FALLA|  ·)" eeff.log | head -20 | sed 's/%/%25/g' | while IFS= read -r linea; do echo "::error title=EEFF IFRS::$linea"; done
          grep -h -E "^(Sector|Total|Resultados)" eeff.log | sed 's/%/%25/g' | while IFS= read -r linea; do echo "::notice title=EEFF IFRS::$linea"; done
          exit $n

      - name: Estados financieros FI · cuadratura y completitud de todos los contextos
        run: python -m fi.scripts.auditar_eeff --permitir-vacio

      - name: Buscar credenciales en el historial
        run: |
          set +e
          python scripts/audit_secretos.py > secretos.log 2>&1; n=$?
          # Las anotaciones llevan el detalle (archivo y tipo) porque los logs de
          # Actions no siempre se pueden recuperar desde fuera del runner.
          awk '/POSIBLES CREDENCIALES/{detalle=1} detalle' secretos.log | head -12 \
            | sed 's/%/%25/g' | while IFS= read -r linea; do echo "::error title=Secretos::$linea"; done
          grep -h -E "Verificación de secretos|blobs de texto|marcadores de posición|identificadores" secretos.log | sed 's/%/%25/g' | while IFS= read -r linea; do echo "::notice title=Secretos (resumen)::$linea"; done
          echo "::notice title=Secretos::$(tail -n 2 secretos.log | head -1)"
          exit $n

      - name: Prueba de comportamiento del DOM (jsdom)
        run: |
          npm install --no-save --no-audit --no-fund jsdom
          node scripts/audit_interfaz_dom.js > dom.log 2>&1; n=$?
          node scripts/test_busqueda_dom.js > busqueda_dom.log 2>&1; b=$?
          grep -h -E "^FALLA" dom.log busqueda_dom.log | head -10 | sed 's/%/%25/g' | while IFS= read -r linea; do echo "::error title=DOM::$linea"; done
          echo "::notice title=DOM::$(tail -n 1 dom.log)"
          tail -n 2 busqueda_dom.log
          exit $(( n | b ))

      - name: 'Aviso de teléfono: flota, se cierra por las tres vías y lo recuerda'
        run: |
          set +e
          node scripts/audit_aviso_movil.js > aviso.log 2>&1; n=$?
          grep -h -E "^FALLA" aviso.log | head -10 | sed 's/%/%25/g' | while IFS= read -r linea; do echo "::error title=Aviso de teléfono::$linea"; done
          echo "::notice title=Aviso de teléfono::$(tail -n 1 aviso.log)"
          exit $n

      - name: 'Índice de notas: los resúmenes no anidan enlaces Markdown'
        run: python3 scripts/test_build_indice_notas.py

      - name: 'Índice de notas: la puerta de entrada no puede quedarse atrás'
        run: |
          set +e
          python3 scripts/build_indice_notas.py --check > notas.log 2>&1; n=$?
          grep -h -E "INDICE-NOTAS" notas.log | sed 's/%/%25/g' | while IFS= read -r linea; do echo "::error title=Índice de notas::$linea"; done
          exit $n

      - name: 'Mapa relacional: los títulos caben y ninguna tarjeta se solapa'
        run: |
          set +e
          node scripts/audit_erd_visual.js > erd.log 2>&1; n=$?
          grep -h -E "\[FALLA\]" erd.log | head -10 | sed 's/%/%25/g' | while IFS= read -r linea; do echo "::error title=Mapa relacional::$linea"; done
          echo "::notice title=Mapa relacional::$(tail -n 1 erd.log)"
          exit $n

      - name: Cifras de portada truncadas hacia abajo y respaldos al día
        run: |
          set +e
          node scripts/audit_cifras.js > cifras.log 2>&1; n=$?
          grep -h -E "\[FALLA\]" cifras.log | head -10 | sed 's/%/%25/g' | while IFS= read -r linea; do echo "::error title=Cifras::$linea"; done
          echo "::notice title=Cifras::$(tail -n 1 cifras.log)"
          exit $n

      - name: Celdas y alias hostiles no ejecutan código (jsdom)
        run: |
          set +e
          node scripts/audit_xss_celdas.js > xss.log 2>&1; n=$?
          grep -h -E "^FALLA" xss.log | head -10 | sed 's/%/%25/g' | while IFS= read -r linea; do echo "::error title=XSS celdas::$linea"; done
          echo "::notice title=XSS celdas::$(tail -n 1 xss.log)"
          exit $n

  # R no está instalado en el entorno de desarrollo, así que el ejemplo de R se
  # verifica aquí o no se anuncia. Job aparte: si el intérprete o el paquete
  # duckdb fallan, la auditoría del sitio no arrastra el fallo, pero el check
  # queda en rojo igual.
  # Este job compila `duckdb` desde fuente si no encuentra el binario, y eso
  # pasa del presupuesto de cualquier job: el 2026-10-23 tardó 40 minutos y el
  # runner lo canceló, dejando el PR en rojo por una causa ajena al cambio.
  #
  # Se fija la imagen en 22.04 —donde el repositorio público de Posit sí tiene
  # binarios de `duckdb`— y se declara el repositorio binario y el User-Agent
  # que exige para servir binarios en vez de fuentes. Si aun así no hubiera
  # binario, el paso falla en 15 minutos con el motivo, en vez de agotar el job.
  r_ejemplos:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: 'R: DBI y duckdb (binario, no fuente)'
        run: |
          timeout 900 Rscript -e '
            options(
              repos = c(CRAN = "https://packagemanager.posit.co/cran/__linux__/jammy/latest"),
              HTTPUserAgent = sprintf("R/%s R (%s)", getRversion(),
                                      paste(getRversion(), R.version["platform"],
                                            R.version["arch"], R.version["os"]))
            )
            install.packages(c("DBI", "duckdb"))
            library(duckdb)
            cat("duckdb", as.character(packageVersion("duckdb")), "\n")
          ' 2>&1 | tee r_install.log
          if grep -qi "compil" r_install.log; then
            echo "::error title=R::se fue a compilar duckdb desde fuente; el binario no llegó"
            exit 1
          fi
      - name: 'R: el ejemplo corre contra la copia del repo'
        run: |
          set +e
          SIF_CHILE_BASE=docs Rscript examples/r/01_basico.R > r.log 2>&1; n=$?
          grep -h -E "^(Vistas creadas|OK -)" r.log | sed 's/%/%25/g' | while IFS= read -r l; do echo "::notice title=R::$l"; done
          if [ "$n" -ne 0 ]; then
            tail -n 8 r.log | sed 's/%/%25/g' | while IFS= read -r l; do echo "::error title=R::$l"; done
          fi
          exit $n

  automatizacion:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Toda tabla publicada tiene quien la actualice
        run: |
          python -m pip install --disable-pip-version-check pyarrow
          set +e
          python scripts/audit_automatizacion.py > auto.log 2>&1; n=$?
          grep -h "^Error" auto.log | head -20 | sed 's/%/%25/g' | while IFS= read -r l; do echo "::error title=Automatizacion::$l"; done
          echo "::notice title=Automatizacion::$(tail -n 1 auto.log)"
          exit $n

      - name: Pruebas de las compuertas compartidas de los pipelines
        run: python -m unittest -v pipelines.auto.tests.test_cuadratura pipelines.auto.tests.test_estable

  # Pruebas unitarias de los extractores y publicadores de estados financieros. Cada publicador
  # corre las suyas antes de publicar, pero solo cuando se dispara; aquí corren en cada PR y push,
  # que es cuando un cambio todavía se puede corregir. Sin red: todo con fuentes sintéticas.
  pruebas:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependencias
        run: python -m pip install --disable-pip-version-check pandas==2.2.3 pyarrow==21.0.0 openpyxl==3.1.5 beautifulsoup4==4.13.5
      - name: AGF, securitizadoras y CCAF · parseo y compuertas compartidas · corredoras · fondos mutuos · banca · macro · seguros
        run: >
          python -m unittest -v
          pipelines.ifrs_sectores.tests.test_actualizar
          pipelines.ifrs_sectores.tests.test_roundtrip_publicado
          pipelines.ifrs_sectores.tests.test_sondeo
          pipelines.auto.tests.test_ifrs_txt
          pipelines.auto.tests.test_cuadratura
          pipelines.auto.tests.test_estable
          pipelines.auto.tests.test_contrato_publicadores
          pipelines.entidades.tests.test_conteos
          corredoras_bolsa.tests.test_actualizar_eeff
          ffmm.tests.test_eeff_xml
          ffmm.tests.test_actualizar_eeff
          bancos.tests.test_inspect_cmf_bank_sample
          bancos.tests.test_extract_cmf_bank_lines
          bancos.tests.test_publish_cmf_bank_period
          bancos.tests.test_bank_master_identity
          bancos.tests.test_importes_normalizados
          # Solo se probaban dentro de su propio publicador (o nunca, en el caso de macro): en un
          # PR no corrían, que es cuando todavía se puede corregir el cambio.
          macro.tests.test_series_bcch
          macro.tests.test_build_tablas_tematicas
          seguros.tests.test_formato_1835
      - name: Fondos de inversión · XML original, cotejo, contextos y publicación
        run: python -m unittest discover -s fi/tests -v
      - name: Factoring y leasing · extracción y publicación
        run: python -m unittest discover -s factoring_leasing/tests -v

  frescura:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.ref_name == github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Cada workflow corrió con éxito dentro de su plazo
        run: |
          set +e
          python scripts/audit_automatizacion.py --frescura --rama "${{ github.event.repository.default_branch }}" > frescura.log 2>&1; n=$?
          cat frescura.log
          grep -h "^Error" frescura.log | head -20 | sed 's/%/%25/g' | while IFS= read -r l; do echo "::error title=Frescura::$l"; done
          if [ $n -ne 0 ]; then
            titulo="Automatización: hay tablas que no se están actualizando"
            cuerpo=$(printf 'Revisión semanal (%s) de scripts/audit_automatizacion.py --frescura:\n\n```\n%s\n```\n\nCorrida: %s/%s/actions/runs/%s' \
              "$(date -u +%F)" "$(cat frescura.log)" "${{ github.server_url }}" "${{ github.repository }}" "${{ github.run_id }}")
            num=$(gh issue list --state open --search "in:title \"$titulo\"" --json number --jq '.[0].number')
            if [ -n "$num" ]; then gh issue comment "$num" --body "$cuerpo"; else gh issue create --title "$titulo" --body "$cuerpo"; fi
          fi
          exit $n
