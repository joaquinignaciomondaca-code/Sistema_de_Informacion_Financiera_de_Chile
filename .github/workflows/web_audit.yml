name: Auditoría de la web (catálogo vs Parquet) y de la automatización

# Comprueba que el explorador, el visor, el diccionario y el ERD apunten a
# Parquet reales y a vistas semánticas registradas en duckdb_client.js.
# Los resultados se publican como anotaciones (los logs de Actions no se
# pueden descargar desde el entorno de trabajo).
#
# Compuerta de diseño (paso «Diseño: anti-patrones de interfaz»): el detector
# determinista de Impeccable corre sobre docs/ sin LLM ni API key. El sitio está
# hoy en cero hallazgos, así que cualquier hallazgo nuevo falla el paso. La
# versión del detector va fijada para que una regla nueva no aparezca sola.
# Contexto y criterios: docs/notas/diseno_detector_2026-10-21.md.
#
# Guardián de automatización (scripts/audit_automatizacion.py, inventario en
# pipelines/auto/inventario.json):
#   * en cada push: toda tabla de data_manifest.json debe tener un workflow con horario que
#     la escriba, o un motivo explícito de por qué es manual. Una tabla nueva sin eso falla.
#   * cada lunes: cada workflow del inventario debe haber corrido con éxito en la rama por
#     defecto dentro de su plazo; si no, se abre (o comenta) un issue.
on:
  schedule:
    - cron: '0 14 * * 1'

  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'scripts/audit_*.py'
      - 'scripts/audit_*.js'
      - 'scripts/normalizar_vocabulario.py'
      - 'scripts/build_download_catalog.py'
      - 'pipelines/**'
      - 'factoring_leasing/**'
      - 'bancos/**'
      - 'corredoras_bolsa/**'
      - 'ffmm/**'
      - '.github/workflows/**'
      - 'data_manifest.json'

  # Antes esto listaba una rama de trabajo concreta, que quedaba obsoleta en cada
  # sesión. Con pull_request, cualquier rama que proponga cambios a main se audita.
  pull_request:
    branches: [main]

  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # fetch-depth: 0 trae el historial completo: la auditoría de credenciales
      # revisa todos los blobs, no sólo el commit actual.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check pyarrow==21.0.0

      - name: Caché del detector de diseño
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/.impeccable/bin
          key: impeccable-4.7.0

      # Compuerta de diseño: 61 reglas deterministas sobre docs/ (sin LLM ni API key).
      # Hoy está en cero hallazgos, así que cualquier hallazgo nuevo falla el paso.
      # La versión va fijada a propósito: el detector es determinista y así una regla
      # nueva no puede aparecer en un push sin que alguien suba esta línea a mano.
      # --github no emite anotaciones en la 4.7.0 (probado con GITHUB_ACTIONS=true),
      # así que se generan desde el JSON. GitHub muestra 10 anotaciones de cada tipo
      # por paso; el resto queda en el log y se resume en el ::notice final.
      - name: 'Diseño: anti-patrones de interfaz (detector determinista)'
        run: |
          set +e
          # Una ruta inexistente no es un error para el detector: devuelve 0 con cero
          # archivos escaneados. Sin esta comprobación, mover o renombrar docs/ apagaría
          # la compuerta en silencio.
          for objetivo in docs/index.html docs/css/app.css; do
            if [ ! -f "$objetivo" ]; then
              echo "::error title=Diseño::falta $objetivo; el detector no tendría qué escanear"
              exit 1
            fi
          done
          # Los artefactos van al directorio temporal del runner, no a la raíz del
          # repositorio (donde quedarían como archivos sin versionar).
          export SALIDA="${RUNNER_TEMP:-/tmp}/diseno"
          correr() {
            DO_NOT_TRACK=1 IMPECCABLE_NO_TELEMETRY=1 \
              npx -y impeccable@4.7.0 detect --no-config --json docs/ > "$SALIDA.json" 2> "$SALIDA.log"
          }
          correr; n=$?
          # 1 = no pudo escanear (red, binario). Un fallo de infraestructura no debe
          # confundirse con un hallazgo: se reintenta una vez y, si persiste, falla
          # con mensaje explícito en vez de dejar la compuerta apagada en silencio.
          if [ $n -eq 1 ]; then
            echo "::warning title=Diseño::el detector no pudo escanear (reintentando una vez)"
            sleep 5
            correr; n=$?
          fi
          if [ $n -eq 1 ]; then
            tail -n 3 "$SALIDA.log" | sed 's/%/%25/g' | while IFS= read -r l; do echo "::error title=Diseño:::$l"; done
            exit 1
          fi
          node -e '
            const fs = require("fs");
            const raiz = (process.env.GITHUB_WORKSPACE || "") + "/";
            const hallazgos = JSON.parse(fs.readFileSync(process.env.SALIDA + ".json", "utf8"));
            for (const h of hallazgos.slice(0, 10)) {
              const archivo = String(h.file).replace(raiz, "");
              const donde = h.line > 0 ? ` file=${archivo},line=${h.line}` : ` file=${archivo}`;
              const texto = `${h.antipattern}: ${h.snippet || ""}`.replace(/%/g, "%25");
              console.log(`::error title=Diseño ${h.antipattern}${donde}::${texto}`);
            }
            const resumen = `${hallazgos.length} hallazgo(s) en docs/ · reglas y guía en docs/notas/diseno_detector_2026-10-21.md`;
            console.log(hallazgos.length ? `::error title=Diseño::${resumen}` : `::notice title=Diseño::${resumen}`);
          '
          # Un JSON ilegible no debe confundirse con "sin hallazgos": si node falla,
          # el paso falla aunque el detector haya salido con 0.
          leible=$?
          if [ $leible -ne 0 ]; then
            echo "::error title=Diseño::no se pudo leer el JSON del detector"
            tail -n 3 "$SALIDA.log" | sed 's/%/%25/g' | while IFS= read -r l; do echo "::error title=Diseño:::$l"; done
            exit 1
          fi
          exit $n

      - name: Auditar navegación y catálogo web
        run: |
          set +e
          python scripts/audit_navigation.py > nav.log 2>&1; n1=$?
          python scripts/audit_web_full.py > web.log 2>&1; n2=$?
          grep -h -E "^(Error|Inconsistencia|Advertencia)|AssertionError" nav.log web.log | head -10 | sed 's/%/%25/g' | while IFS= read -r linea; do echo "::error title=Auditoria web::$linea"; done
          tail -n 3 nav.log web.log | sed 's/%/%25/g' | while IFS= read -r linea; do echo "::warning title=Auditoria web (cola)::$linea"; done
          echo "::notice title=Auditoria web::navigation=$n1 audit_full=$n2 (0 = sin hallazgos)"
          exit $(( n1 || n2 ))

      - name: Auditar interfaz, vocabulario y catálogo de descargas
        run: |
          set +e
          python scripts/audit_interfaz.py > interfaz.log 2>&1; n=$?
          grep -h -E "^(Error|Inconsistencia|Advertencia)|^  - " interfaz.log | head -10 | sed 's/%/%25/g' | while IFS= read -r linea; do echo "::error title=Interfaz::$linea"; done
          echo "::notice title=Interfaz::$(tail -n 2 interfaz.log | head -1)"
          exit $n

      - name: Auditor de formatos de RUT (guardián de la convención)
        run: |
          set +e
          python scripts/audit_rut_formatos.py > rut.log 2>&1; n=$?
          grep -h "^Error" rut.log | head -20 | sed 's/%/%25/g' | while IFS= read -r linea; do echo "::error title=RUT::$linea"; done
          echo "::notice title=RUT::$(tail -n 1 rut.log)"
          exit $n

      - name: Auditar las consultas sugeridas contra los Parquet
        run: |
          python -m pip install --disable-pip-version-check duckdb
          set +e
          python scripts/audit_consultas_sugeridas.py --check > consultas.log 2>&1; n=$?
          grep -h -E "^(FALLA|  ·)" consultas.log | head -10 | sed 's/%/%25/g' | while IFS= read -r linea; do echo "::error title=Consultas sugeridas::$linea"; done
          grep -h -E "Consultas sugeridas|OK|VACIA|ERROR" consultas.log | sed 's/%/%25/g' | while IFS= read -r linea; do echo "::notice title=Consultas sugeridas::$linea"; done
          exit $n

      - name: Prueba del cliente DuckDB (registro de vistas sin navegador)
        run: |
          set +e
          node scripts/audit_duckdb_client.js > cliente.log 2>&1; n=$?
          grep -h "^FALLA" cliente.log | head -10 | sed 's/%/%25/g' | while IFS= read -r linea; do echo "::error title=Cliente DuckDB::$linea"; done
          echo "::notice title=Cliente DuckDB::$(tail -n 1 cliente.log)"
          exit $n

      - name: La consola SQL es de solo lectura (guardia)
        run: |
          set +e
          node scripts/audit_sql_guard.js > guardia.log 2>&1; n=$?
          grep -h "^FALLA" guardia.log | head -10 | sed 's/%/%25/g' | while IFS= read -r linea; do echo "::error title=Guardia SQL::$linea"; done
          echo "::notice title=Guardia SQL::$(tail -n 1 guardia.log)"
          exit $n

      - name: 'Estados financieros IFRS publicados: cuadratura sobre toda la historia'
        run: |
          python -m pip install --disable-pip-version-check pandas==2.2.3 pyarrow==21.0.0
          set +e
          python scripts/auditar_eeff_ifrs.py > eeff.log 2>&1; n=$?
          grep -h -E "^(FALLA|  ·)" eeff.log | head -20 | sed 's/%/%25/g' | while IFS= read -r linea; do echo "::error title=EEFF IFRS::$linea"; done
          grep -h -E "^(Sector|Total|Resultados)" eeff.log | sed 's/%/%25/g' | while IFS= read -r linea; do echo "::notice title=EEFF IFRS::$linea"; done
          exit $n

      - name: Estados financieros FI · cuadratura y completitud de todos los contextos
        run: python -m fi.scripts.auditar_eeff --permitir-vacio

      - name: Buscar credenciales en el historial
        run: |
          set +e
          python scripts/audit_secretos.py > secretos.log 2>&1; n=$?
          # Las anotaciones llevan el detalle (archivo y tipo) porque los logs de
          # Actions no siempre se pueden recuperar desde fuera del runner.
          awk '/POSIBLES CREDENCIALES/{detalle=1} detalle' secretos.log | head -12 \
            | sed 's/%/%25/g' | while IFS= read -r linea; do echo "::error title=Secretos::$linea"; done
          grep -h -E "Verificación de secretos|blobs de texto|marcadores de posición|identificadores" secretos.log | sed 's/%/%25/g' | while IFS= read -r linea; do echo "::notice title=Secretos (resumen)::$linea"; done
          echo "::notice title=Secretos::$(tail -n 2 secretos.log | head -1)"
          exit $n

      - name: Prueba de comportamiento del DOM (jsdom)
        run: |
          npm install --no-save --no-audit --no-fund jsdom
          node scripts/audit_interfaz_dom.js > dom.log 2>&1; n=$?
          grep -h -E "^FALLA" dom.log | head -10 | sed 's/%/%25/g' | while IFS= read -r linea; do echo "::error title=DOM::$linea"; done
          echo "::notice title=DOM::$(tail -n 1 dom.log)"
          exit $n

      - name: Celdas y alias hostiles no ejecutan código (jsdom)
        run: |
          set +e
          node scripts/audit_xss_celdas.js > xss.log 2>&1; n=$?
          grep -h -E "^FALLA" xss.log | head -10 | sed 's/%/%25/g' | while IFS= read -r linea; do echo "::error title=XSS celdas::$linea"; done
          echo "::notice title=XSS celdas::$(tail -n 1 xss.log)"
          exit $n

  automatizacion:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Toda tabla publicada tiene quien la actualice
        run: |
          python -m pip install --disable-pip-version-check pyarrow
          set +e
          python scripts/audit_automatizacion.py > auto.log 2>&1; n=$?
          grep -h "^Error" auto.log | head -20 | sed 's/%/%25/g' | while IFS= read -r l; do echo "::error title=Automatizacion::$l"; done
          echo "::notice title=Automatizacion::$(tail -n 1 auto.log)"
          exit $n

      - name: Pruebas de las compuertas compartidas de los pipelines
        run: python -m unittest -v pipelines.auto.tests.test_cuadratura pipelines.auto.tests.test_estable

  # Pruebas unitarias de los extractores y publicadores de estados financieros. Cada publicador
  # corre las suyas antes de publicar, pero solo cuando se dispara; aquí corren en cada PR y push,
  # que es cuando un cambio todavía se puede corregir. Sin red: todo con fuentes sintéticas.
  pruebas:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependencias
        run: python -m pip install --disable-pip-version-check pandas==2.2.3 pyarrow==21.0.0 openpyxl==3.1.5 beautifulsoup4==4.13.5
      - name: AGF, securitizadoras y CCAF · parseo y compuertas compartidas · corredoras · fondos mutuos · banca · macro · seguros
        run: >
          python -m unittest -v
          pipelines.ifrs_sectores.tests.test_actualizar
          pipelines.ifrs_sectores.tests.test_roundtrip_publicado
          pipelines.ifrs_sectores.tests.test_sondeo
          pipelines.auto.tests.test_ifrs_txt
          pipelines.auto.tests.test_cuadratura
          pipelines.auto.tests.test_estable
          pipelines.auto.tests.test_contrato_publicadores
          pipelines.entidades.tests.test_conteos
          corredoras_bolsa.tests.test_actualizar_eeff
          ffmm.tests.test_eeff_xml
          ffmm.tests.test_actualizar_eeff
          bancos.tests.test_inspect_cmf_bank_sample
          bancos.tests.test_extract_cmf_bank_lines
          bancos.tests.test_publish_cmf_bank_period
          bancos.tests.test_bank_master_identity
          # Solo se probaban dentro de su propio publicador (o nunca, en el caso de macro): en un
          # PR no corrían, que es cuando todavía se puede corregir el cambio.
          macro.tests.test_series_bcch
          seguros.tests.test_formato_1835
      - name: Fondos de inversión · XML original, cotejo, contextos y publicación
        run: python -m unittest discover -s fi/tests -v
      - name: Factoring y leasing · extracción y publicación
        run: python -m unittest discover -s factoring_leasing/tests -v

  frescura:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.ref_name == github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Cada workflow corrió con éxito dentro de su plazo
        run: |
          set +e
          python scripts/audit_automatizacion.py --frescura --rama "${{ github.event.repository.default_branch }}" > frescura.log 2>&1; n=$?
          cat frescura.log
          grep -h "^Error" frescura.log | head -20 | sed 's/%/%25/g' | while IFS= read -r l; do echo "::error title=Frescura::$l"; done
          if [ $n -ne 0 ]; then
            titulo="Automatización: hay tablas que no se están actualizando"
            cuerpo=$(printf 'Revisión semanal (%s) de scripts/audit_automatizacion.py --frescura:\n\n```\n%s\n```\n\nCorrida: %s/%s/actions/runs/%s' \
              "$(date -u +%F)" "$(cat frescura.log)" "${{ github.server_url }}" "${{ github.repository }}" "${{ github.run_id }}")
            num=$(gh issue list --state open --search "in:title \"$titulo\"" --json number --jq '.[0].number')
            if [ -n "$num" ]; then gh issue comment "$num" --body "$cuerpo"; else gh issue create --title "$titulo" --body "$cuerpo"; fi
          fi
          exit $n
