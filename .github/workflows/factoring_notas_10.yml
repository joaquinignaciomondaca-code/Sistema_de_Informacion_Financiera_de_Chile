name: Notas EEFF factoring — 10 PDF

# Diez PDF de marzo 2026. Cada línea de la cara, y la nota solo si suma esa línea.
# No es el masivo y no toca securitizadoras.
on:
  push:
    branches: [arena/01a0db9a-monitor-financiero-chile]
    paths:
      - .github/workflows/factoring_notas_10.yml
      - factoring_leasing/scripts/06_notas_10_pdf.py
      - factoring_leasing/scripts/04_prueba_10_pdf.py
      - pipelines/eeff/parse_pdf_notas.py
      - pipelines/eeff/parse_pdf_caratula.py
      - factoring_leasing/eeff_prueba/notas10.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  notas:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Dependencias
        run: pip install -q pymupdf pdfplumber
      - name: Pruebas del lector
        run: |
          python -c "import pipelines.eeff.test_parse_pdf_notas as t; [getattr(t,n)() for n in dir(t) if n.startswith('test_')]"
          python -c "import pipelines.eeff.test_parse_pdf_caratula as t; [getattr(t,n)() for n in dir(t) if n.startswith('test_')]"
      - name: Diez PDF
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          set -o pipefail
          mkdir -p factoring_leasing/eeff_prueba/notas10
          python factoring_leasing/scripts/06_notas_10_pdf.py 2>&1 | tee factoring_leasing/eeff_prueba/notas10/corrida.txt
      - name: Rama de revisión
        if: always()
        run: |
          RAMA="actions/fl-notas10-${{ github.run_id }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$RAMA"
          git add factoring_leasing/eeff_prueba/notas10
          git commit -m "factoring: notas de diez PDF, run ${{ github.run_id }}" || echo "sin cambios"
          git push -u origin "$RAMA"
