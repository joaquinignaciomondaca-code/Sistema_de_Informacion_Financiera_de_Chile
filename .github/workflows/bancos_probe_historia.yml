name: Sonda formato histórico CMF bancos (sin publicación)

on:
  push:
    branches: [arena/01a0e5fb-monitor-financiero-chile]
    paths:
      - bancos/scripts/probe_history_layout.py
      - .github/workflows/bancos_probe_historia.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check openpyxl==3.1.5 pyarrow==21.0.0
      - name: Sonda 2022-01 → 2026-07 (cada 3 meses + bordes)
        run: python -m bancos.scripts.probe_history_layout --modelos 2022-01
