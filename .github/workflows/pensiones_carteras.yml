name: Pensiones · ingesta histórica BDP y publicación protegida

on:
  schedule:
    # Revisión mensual. La descarga/ingesta sólo corre en un runner privado
    # persistente que el propietario habilite; sin él, este job es control de estado.
    - cron: '25 10 10 * *'
  push:
    paths:
      - 'pensiones/scripts/**'
      - 'pensiones/tests/**'
      - 'pensiones/config/**'
      - 'pensiones/AUTOMATIZACION_BDP.md'
      - '.github/workflows/pensiones_carteras.yml'
  pull_request:
    paths:
      - 'pensiones/**'
      - '.github/workflows/pensiones_carteras.yml'
  workflow_dispatch:
    inputs:
      operacion:
        description: 'Operación solicitada; ninguna opción salta los gates de publicación'
        required: true
        default: solo_auditoria
        type: choice
        options:
          - solo_auditoria
          - backfill
          - incremental
          - publicar
      max_lotes:
        description: 'Máximo de lotes CSV por corrida; 0 = hasta completar o agotar tiempo'
        required: true
        default: '0'
        type: string
      minutos:
        description: 'Presupuesto de ingesta por corrida (minutos)'
        required: true
        default: '300'
        type: string

permissions:
  contents: read

concurrency:
  group: pensiones-bdp-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependencia Parquet
        run: python -m pip install --disable-pip-version-check pyarrow==21.0.0
      - name: Pruebas sintéticas sin red (descarga, reanudación, incremental, auditoría y gate)
        run: python -m unittest discover -s pensiones/tests -v
      - name: Configuración oficial y gate de publicación
        run: |
          python -m pensiones.scripts.download_bdp_packages --check-only
          python -m pensiones.scripts.check_publicacion_bdp
          {
            echo '### BDP: publicación bloqueada por diseño'
            echo 'No se incorporan originales ni Parquet a `docs/outputs/` en pruebas o pull requests.'
            echo 'Sin URL de descarga observada en la interfaz oficial, cotejo SP y evidencia de redistribución, no hay descarga automática ni deploy de datos.'
          } >> "$GITHUB_STEP_SUMMARY"

  source-status:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Informar condiciones previas sin acceder a SP
        run: |
          python -m pensiones.scripts.download_bdp_packages --check-only | tee source-status.json
          python -m pensiones.scripts.check_publicacion_bdp | tee publication-status.json
          {
            echo '### Estado de automatización BDP'
            echo '- El chequeo no realiza solicitudes a SP ni intenta descubrir POST, tokens o URLs.'
            echo '- El runner de staging persistente está habilitado: `${{ vars.BDP_PRIVATE_RUNNER_READY == 'true' }}`.'
            echo '- Vercel no recibe datos mientras la política permanezca bloqueada.'
          } >> "$GITHUB_STEP_SUMMARY"

  private-ingest:
    # No se guardan datos privados como artifact/cache de un repositorio público.
    # El administrador debe configurar un runner propio, aislado y con .local-data
    # persistente; Actions hospedado no puede reanudar entre ejecuciones sin exponer staging.
    if: >-
      github.ref_name == github.event.repository.default_branch &&
      vars.BDP_PRIVATE_RUNNER_READY == 'true' &&
      (github.event_name == 'schedule' ||
       (github.event_name == 'workflow_dispatch' && inputs.operacion != 'solo_auditoria'))
    runs-on: [self-hosted, linux, bdp-private-stage]
    timeout-minutes: 330
    outputs:
      publication_ready: ${{ steps.gate.outputs.ready }}
      operation: ${{ steps.mode.outputs.operation }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          clean: false
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar Parquet
        run: python -m pip install --disable-pip-version-check pyarrow==21.0.0

      - name: Seleccionar operación
        id: mode
        run: |
          if [ "${{ github.event_name }}" = 'schedule' ]; then
            echo 'operation=incremental' >> "$GITHUB_OUTPUT"
          else
            echo 'operation=${{ inputs.operacion }}' >> "$GITHUB_OUTPUT"
          fi

      - name: Comprobar catálogo de fuentes capturadas
        id: sources
        run: |
          set +e
          python -m pensiones.scripts.download_bdp_packages --check-only > source.json
          rc=$?
          set -e
          cat source.json
          ready=$(python -c 'import json; print(str(json.load(open("source.json"))["ready"]).lower())')
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
          if [ "$ready" != 'true' ]; then
            echo 'Catálogo sin captura oficial: no se contactó a SP ni se descargó información.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

      - name: Descargar paquetes con TLS, host/redirect allowlist, ZIP/CRC y SHA-256
        if: steps.sources.outputs.ready == 'true'
        run: python -m pensiones.scripts.download_bdp_packages --output .local-data/pensiones/bdp/originales

      - name: Reanudar backfill/incremental desde checkpoints privados
        if: steps.sources.outputs.ready == 'true' && steps.mode.outputs.operation != 'solo_auditoria'
        env:
          BDP_MAX_LOTES: ${{ inputs.max_lotes }}
          BDP_MINUTOS: ${{ inputs.minutos }}
          BDP_OPERATION: ${{ steps.mode.outputs.operation }}
        run: |
          args=(--scan .local-data/pensiones/bdp/originales --output .local-data/pensiones/bdp/staging --max-lotes "${BDP_MAX_LOTES:-0}" --minutos "${BDP_MINUTOS:-300}")
          if [ "$BDP_OPERATION" = 'incremental' ]; then args+=(--incremental); fi
          set +e
          python -m pensiones.scripts.extraer_carteras_afp "${args[@]}"
          rc=$?
          set -e
          # El código 2 significa límite/reanudación con checkpoint íntegro, no datos publicados.
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 2 ]; then exit "$rc"; fi
          python -m pensiones.scripts.audit_carteras_afp .local-data/pensiones/bdp/staging --allow-incomplete --allow-quarantine

      - name: Auditar staging preexistente (sin recalcular ni publicar)
        if: steps.sources.outputs.ready == 'true' && steps.mode.outputs.operation == 'solo_auditoria'
        run: python -m pensiones.scripts.audit_carteras_afp .local-data/pensiones/bdp/staging --allow-incomplete --allow-quarantine

      - name: Evaluar todos los bloqueos de publicación
        id: gate
        if: always()
        run: |
          set +e
          python -m pensiones.scripts.check_publicacion_bdp --staging .local-data/pensiones/bdp/staging > gate.json
          rc=$?
          set -e
          cat gate.json
          if [ "$rc" -ne 0 ]; then echo 'ready=false' >> "$GITHUB_OUTPUT"; exit 0; fi
          ready=$(python -c 'import json; print(str(json.load(open("gate.json"))["ready"]).lower())')
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
          if [ "$ready" != 'true' ]; then echo 'Publicación omitida: no hay evidencia suficiente para abrir los gates.' >> "$GITHUB_STEP_SUMMARY"; fi

  publish:
    needs: private-ingest
    if: >-
      github.ref_name == github.event.repository.default_branch &&
      github.event_name == 'workflow_dispatch' &&
      inputs.operacion == 'publicar' &&
      needs.private-ingest.outputs.publication_ready == 'true'
    runs-on: [self-hosted, linux, bdp-private-stage]
    environment: pensiones-publicacion
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          clean: false
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check pyarrow==21.0.0
      - name: Publicar de forma atómica (el script vuelve a validar la política)
        run: python -m pensiones.scripts.publish_bdp --staging .local-data/pensiones/bdp/staging
      - name: Confirmar datos validados en la rama de producción
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/outputs/pensiones/bdp
          if git diff --cached --quiet; then
            echo 'No hay cambios de contenido para publicar.'
            exit 0
          fi
          git commit -m 'Publica carteras AFP BDP auditadas'
          git push origin "HEAD:${{ github.event.repository.default_branch }}"
      - name: Solicitar deploy Vercel si el propietario configuró un hook
        id: vercel
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -n "${VERCEL_DEPLOY_HOOK:-}" ]; then
            curl --fail --silent --show-error --request POST "$VERCEL_DEPLOY_HOOK"
            echo 'used=true' >> "$GITHUB_OUTPUT"
          else
            echo 'used=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Resumen de despliegue
        if: success()
        run: |
          if [ "${{ steps.vercel.outputs.used }}" = 'true' ]; then
            echo 'Publicación enviada; se invocó el deploy hook protegido de Vercel.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Publicación confirmada en Git. Verifique que la integración Git de Vercel haya iniciado el despliegue de producción; no hay hook configurado.' >> "$GITHUB_STEP_SUMMARY"
          fi
