name: Extracción CMF — Securitizadoras y Patrimonios Separados

# Corre el pipeline en runners de GitHub (con salida a internet) y deja los resultados en ramas
# `actions/ps-extraccion-<desde>-<hasta>-<run>` para integrarlos por PR.
# Dos formas de lanzarlo: (a) manual desde la pestaña Actions; (b) commit que modifique
# securitizadoras/extraccion/run.json. Parámetros de run.json:
#   desde, hasta, trimestres ("03,06,09,12" | "12"), step (todo | ps | maestro | gestoras),
#   tramos  (opcional) lista de [desde, hasta] → un job paralelo por tramo (la historia completa en ~1 h en vez de 4-6 h),
#   ruts    (opcional) cuerpos de RUT separados por coma → sólo esas administradoras (diagnóstico),
#   debug   (opcional) "true" → texto de los PDFs que no cuadran en docs/outputs/securitizadoras/_debug/ de la rama de resultados.
on:
  push:
    paths: ["securitizadoras/extraccion/run.json"]
  workflow_dispatch:
    inputs:
      desde:
        description: "Primer año del paso ps"
        default: "2010"
      hasta:
        description: "Último año"
        default: "2026"
      trimestres:
        description: "Meses de cierre (03,06,09,12)"
        default: "03,06,09,12"
      step:
        description: "Paso del pipeline (todo | ps | maestro | gestoras)"
        default: "todo"

permissions:
  contents: write

jobs:
  params:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.p.outputs.matrix }}
      trimestres: ${{ steps.p.outputs.trimestres }}
      step: ${{ steps.p.outputs.step }}
      ruts: ${{ steps.p.outputs.ruts }}
      debug: ${{ steps.p.outputs.debug }}
    steps:
      - uses: actions/checkout@v4
      - name: Parámetros (inputs manuales o securitizadoras/extraccion/run.json)
        id: p
        run: |
          python - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, os
          d = {"desde": "2010", "hasta": "2026", "trimestres": "03,06,09,12", "step": "todo", "ruts": "", "debug": "", "tramos": None}
          if "${{ github.event_name }}" == "workflow_dispatch":
              d.update({"desde": "${{ inputs.desde }}", "hasta": "${{ inputs.hasta }}", "trimestres": "${{ inputs.trimestres }}", "step": "${{ inputs.step }}"})
          elif os.path.exists("securitizadoras/extraccion/run.json"):
              d.update({k: v for k, v in json.load(open("securitizadoras/extraccion/run.json")).items() if not k.startswith("_")})
          tramos = d.get("tramos") or [[d["desde"], d["hasta"]]]
          # con varios tramos, maestro/gestoras (no dependen del año) corren sólo en el primero; el resto hace 'ps'
          inc = [{"desde": str(a), "hasta": str(b), "step": d["step"] if i == 0 or d["step"] != "todo" else "ps"} for i, (a, b) in enumerate(tramos)]
          print("matrix=" + json.dumps({"include": inc}))
          for k in ("trimestres", "step", "ruts", "debug"):
              print(f"{k}={d.get(k) or ''}")
          EOF

  extraer:
    needs: params
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.params.outputs.matrix) }}
    name: "${{ matrix.step }} ${{ matrix.desde }}-${{ matrix.hasta }}"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Dependencias
        run: |
          pip install -q -r requirements.txt
          sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-spa >/dev/null && pip install -q pillow
          tesseract --version | head -1
      - name: Pruebas del parser (sin red)
        run: python securitizadoras/tests/test_pipeline_securitizadoras.py
      - name: Conectividad CMF
        run: |
          python - <<'EOF'
          import urllib.request
          h = urllib.request.urlopen(urllib.request.Request("https://www.cmfchile.cl/institucional/mercados/consulta_busqueda.php?valor=securitizadora", headers={"User-Agent": "Mozilla/5.0"}), timeout=60).read()
          print("CMF OK:", len(h), "bytes;", h.count(b"RGSEC"), "enlaces RGSEC")
          assert h.count(b"RGSEC") > 0
          EOF
      - name: Pipeline
        env:
          MFC_PS_RUTS: ${{ needs.params.outputs.ruts }}
          MFC_PS_DEBUG_DIR: ${{ needs.params.outputs.debug == 'true' && 'docs/outputs/securitizadoras/_debug' || '' }}
        run: |
          python securitizadoras/scripts/pipeline_securitizadoras.py --step "${{ matrix.step }}" --desde "${{ matrix.desde }}" --hasta "${{ matrix.hasta }}" --trimestres "${{ needs.params.outputs.trimestres }}" 2>&1 | tee pipeline.log
          grep -c "lineas=" pipeline.log | xargs -I{} echo "PDFs con líneas extraídas: {}"
      - name: Auditoría (informativa; el veredicto se toma al integrar)
        run: python securitizadoras/scripts/audit_patrimonios_separados_v2.py --json audit_securitizadoras.json
        continue-on-error: true
      - name: Publicar rama con resultados
        run: |
          RAMA="actions/ps-extraccion-${{ matrix.desde }}-${{ matrix.hasta }}-${{ github.run_id }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$RAMA"
          git add docs/outputs/securitizadoras/
          git commit -m "securitizadoras: extracción CMF (${{ matrix.step }} ${{ matrix.desde }}-${{ matrix.hasta }} trimestres ${{ needs.params.outputs.trimestres }}) run ${{ github.run_id }}" || echo "sin cambios"
          git push -u origin "$RAMA"
          echo "RAMA=$RAMA" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: extraccion-${{ github.run_id }}-${{ matrix.desde }}-${{ matrix.hasta }}
          path: |
            pipeline.log
            audit_securitizadoras.json
