name: Sonda temporal fuentes masivas IFRS (AGF, securitizadoras, CCAF, cooperativas, corredoras)
on:
  push:
    branches: [arena/01a0e680-monitor-financiero-chile]
    paths: [.github/workflows/sonda_ifrs.yml]
permissions:
  contents: write
jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Corredoras (archivo masivo por trimestre)
        run: |
          python -m pip install -q openpyxl pandas xlrd
          mkdir -p scratch/sonda_corredoras && cd scratch/sonda_corredoras
          UA='Mozilla/5.0 (compatible; MonitorFinancieroChile/1.0)'
          B='https://www.cmfchile.cl/institucional/estadisticas/merc_valores/intermediarios_fecu_ifrs/intermediarios_ifrs1.php?lang=es&sociedad%5B%5D=0&ag=0&indcon=0&xls=y&tiposociedad=1&cuenta=&estimado=2&vsn=2'
          curl -s -A "$UA" --max-time 300 "${B/xls=y/xls=n}&mes1=06&anno1=2026&mes2=06&anno2=2026" -o html_202606.html
          for p in "03 2010" "12 2010" "03 2011" "06 2011"; do set -- $p
            curl -s -A "$UA" --max-time 300 "$B&mes1=$1&anno1=$2&mes2=$1&anno2=$2" -o "c_$2$1.bin"; done
          ls -la
          python3 - <<'PY' > resumen3.txt 2>&1
          import re, glob
          h=open('html_202606.html','rb').read().decode('utf-8','replace')
          print('html bytes', len(h))
          ths=re.findall(r'<t[hd][^>]*>(.*?)</t[hd]>', h, re.S)
          ths=[re.sub(r'<[^>]+>','',t).strip() for t in ths]
          print([t for t in ths if re.match(r'\d\d\.\d\d\.\d\d', t)][:200])
          print(ths[:40])
          for f in sorted(glob.glob('c_*.bin')):
              print(f, open(f,'rb').read()[:4])
          PY
          rm -f c_*.bin
      - name: Guardar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scratch/sonda_corredoras
          git commit -m "Sonda fuentes IFRS" && for i in 1 2 3; do git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break; sleep 10; done
