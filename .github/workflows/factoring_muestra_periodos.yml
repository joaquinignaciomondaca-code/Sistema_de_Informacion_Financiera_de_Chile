name: Muestra EEFF factoring — tres cortes

# Security individual: 2013, 2018 y marzo 2026. Solo para mirar las notas.
# No es el masivo y no toca securitizadoras.
on:
  push:
    branches: [arena/01a0db9a-monitor-financiero-chile]
    paths:
      - .github/workflows/factoring_muestra_periodos.yml
      - factoring_leasing/scripts/05_muestra_periodos.py
      - factoring_leasing/eeff_prueba/muestra_periodos.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  muestra:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Dependencias
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-spa
          tesseract --list-langs
          pip install -q pymupdf
      - name: Tres cortes de Security
        env:
          MUESTRA_SOLO: "2013-12"
        run: |
          set +e
          mkdir -p factoring_leasing/eeff_prueba/muestra_periodos
          python factoring_leasing/scripts/05_muestra_periodos.py > factoring_leasing/eeff_prueba/muestra_periodos/corrida.txt 2>&1
          code=$?
          echo "exit=$code" >> factoring_leasing/eeff_prueba/muestra_periodos/corrida.txt
          tail -30 factoring_leasing/eeff_prueba/muestra_periodos/corrida.txt
          exit $code
      - name: Rama de revisión
        if: always()
        run: |
          RAMA="actions/fl-muestra-${{ github.run_id }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$RAMA"
          git add factoring_leasing/eeff_prueba/muestra_periodos
          git commit -m "factoring: muestra Security 2013, 2018 y 2026-03, run ${{ github.run_id }}" || echo "sin cambios"
          git push -u origin "$RAMA"
