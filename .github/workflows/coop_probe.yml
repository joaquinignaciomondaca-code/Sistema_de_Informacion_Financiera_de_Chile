name: Sonda Reporte Financiero Cooperativas CMF (sin publicación)

on:
  push:
    branches: [arena/01a0e5fb-monitor-financiero-chile]
    paths:
      - cooperativas/scripts/probe_coop_layout.py
      - .github/workflows/coop_probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check openpyxl==3.1.5
      - run: python -m pip install --disable-pip-version-check xlrd==2.0.1
      - run: python -m pip install --disable-pip-version-check pyarrow==21.0.0
      - name: celdas 2019-11
        run: python -m cooperativas.scripts.probe_coop_layout cells 2019-11 "^activos cooperativas"
