name: Sonda Reporte Financiero Cooperativas CMF (sin publicación)

on:
  push:
    branches: [arena/01a0e66e-monitor-financiero-chile]
    paths:
      - cooperativas/scripts/probe_coop_layout.py
      - .github/workflows/coop_probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check openpyxl==3.1.5
      - run: python -m pip install --disable-pip-version-check xlrd==2.0.1
      - run: python -m pip install --disable-pip-version-check pyarrow==21.0.0
      - name: Hojas de resultados 2019-11 y 2026-07
        run: python -m cooperativas.scripts.probe_coop_layout coop_sheet 2019-11,2026-07 "^estado resultados coop"
