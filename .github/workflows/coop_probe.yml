name: Sonda Reporte Financiero Cooperativas CMF (sin publicación)

on:
  push:
    branches: [arena/01a0e5fb-monitor-financiero-chile]
    paths:
      - cooperativas/scripts/probe_coop_layout.py
      - .github/workflows/coop_probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check openpyxl==3.1.5
      - run: python -m pip install --disable-pip-version-check xlrd==2.0.1
      - name: layouts A
        run: python -m cooperativas.scripts.probe_coop_layout layouts 2008-03,2010-01,2013-01,2016-12
        continue-on-error: true
      - name: layouts B
        run: python -m cooperativas.scripts.probe_coop_layout layouts 2017-01,2019-06,2020-07,2020-08
        continue-on-error: true
      - name: layouts C
        run: python -m cooperativas.scripts.probe_coop_layout layouts 2021-06,2023-06,2025-01,2026-07
        continue-on-error: true
