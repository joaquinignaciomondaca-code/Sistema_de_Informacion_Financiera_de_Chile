name: Cartera de inversiones de fondos mutuos (CMF, Circular 1333), cada 3 días, incremental

on:
  schedule:
    # Cada 3 días (14:00 UTC). Los fondos informan el mes M dentro de 5 días hábiles; el
    # publicador espera 12 días desde el cierre y exige que la cartera nacional traiga al menos el
    # 90 % de los fondos del mes anterior. Los meses ya publicados no se vuelven a descargar.
    - cron: '0 14 */3 * *'
  # Primera carga: al subir cambios del publicador se ejecuta y completa los meses pendientes.
  push:
    branches:
      - main
    paths:
      - .github/workflows/ffmm_carteras.yml
      - ffmm/scripts/actualizar_carteras.py
  workflow_dispatch:
    inputs:
      desde:
        description: 'Primer cierre (AAAA-MM); vacío = autodescubre el más antiguo disponible'
        default: ''
        type: string
      hasta:
        description: 'Último cierre (vacío = último admisible por plazo CMF)'
        default: ''
        type: string
      minutos:
        description: 'Tiempo máximo en minutos; el progreso se conserva'
        default: '270'
        type: string
      max_periodos:
        description: 'Máximo de cierres a revisar por corrida (0 = sin tope)'
        default: '0'
        type: string

permissions:
  contents: write

concurrency:
  group: ffmm-carteras-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validar-y-publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    outputs:
      publicados: ${{ steps.publicar.outputs.publicados }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: python -m pip install --disable-pip-version-check pandas==2.2.3 pyarrow==21.0.0

      # Si todavía existen las descargas antiguas de FUTU/OPCI se reutilizan (mismo formato CMF).
      - name: Preparar caché de descargas
        run: |
          mkdir -p /tmp/cmf1333
          if [ -d ffmm/circular_1333_cartera/inputs ]; then cp ffmm/circular_1333_cartera/inputs/*.txt /tmp/cmf1333/ || true; fi

      - name: Diagnóstico de los meses pendientes (no escribe)
        continue-on-error: true
        run: python -m ffmm.scripts.actualizar_carteras --diagnostico --cache /tmp/cmf1333 --max-periodos "${{ inputs.max_periodos || '400' }}"

      - name: Descargar, validar y publicar los meses pendientes
        id: publicar
        env:
          DESDE: ${{ inputs.desde }}
          HASTA: ${{ inputs.hasta }}
          MINUTOS: ${{ inputs.minutos }}
          PERIODOS: ${{ inputs.max_periodos }}
        run: |
          args=()
          if [ -n "${DESDE}" ]; then args+=(--desde "${DESDE}"); fi
          if [ -n "${HASTA}" ]; then args+=(--hasta "${HASTA}"); fi
          python -m ffmm.scripts.actualizar_carteras --cache /tmp/cmf1333 \
            --minutos "${MINUTOS:-270}" --max-periodos "${PERIODOS:-0}" "${args[@]}"

      - name: Confirmar los meses publicados
        if: always() && steps.publicar.outcome != 'skipped'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Primero solo los datos del sector (no chocan con otros workflows); luego, sobre la
          # versión más reciente de la rama, se recalculan las entradas del sector en data_manifest.json.
          git add docs/outputs/ffmm
          if git diff --cached --quiet; then echo 'Sin cambios.'; exit 0; fi
          ultimo=$(python -c "import json;print(max(json.load(open('docs/outputs/ffmm/manifest.json'))['periodos']))")
          git commit -m "FFMM: cartera de inversiones hasta ${ultimo}"
          git checkout -- data_manifest.json
          datos=$(git rev-parse HEAD)
          # Varias publicaciones compiten por la misma rama: un cherry-pick en
          # conflicto o un push rechazado no deben abortar el paso (la shell corre
          # con `bash -e`). Se reintenta sobre la cabeza nueva, con espera aleatoria
          # para desincronizar las corridas que arrancan juntas.
          for i in 1 2 3 4 5 6 7 8; do
            git fetch origin "${GITHUB_REF_NAME}"
            git reset --hard FETCH_HEAD
            if ! git cherry-pick "$datos"; then
              git cherry-pick --abort || git reset --hard FETCH_HEAD
              echo "Cherry-pick en conflicto (intento ${i}/8): otra publicación tocó los mismos archivos."
              sleep $(( 15 + RANDOM % 20 ))
              continue
            fi
            python -m ffmm.scripts.actualizar_carteras --solo-data-manifest
            python scripts/build_download_catalog.py
            git add data_manifest.json docs/js/download_catalog.js
            git diff --cached --quiet || git commit -m "FFMM: data_manifest"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
            echo "Push rechazado (intento ${i}/8): otra corrida publicó primero."
            sleep $(( 15 + RANDOM % 20 ))
          done
          echo "::error title=Publicación en la rama::No se pudo publicar tras 8 intentos por contención en ${GITHUB_REF_NAME}"
          exit 1

