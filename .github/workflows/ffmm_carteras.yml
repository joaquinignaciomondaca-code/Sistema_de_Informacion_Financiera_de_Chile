name: Cartera de inversiones de fondos mutuos (CMF, Circular 1333), 3 veces al mes, incremental

on:
  schedule:
    # Días 8, 18 y 28 (14:00 UTC). Los fondos informan el mes M dentro de 5 días hábiles; el
    # publicador espera 12 días desde el cierre y exige que la cartera nacional traiga al menos el
    # 90 % de los fondos del mes anterior. Los meses ya publicados no se vuelven a descargar.
    - cron: '0 14 8,18,28 * *'
  # Primera carga: al subir cambios del publicador se ejecuta y completa los meses pendientes.
  push:
    branches:
      - main
      - arena/01a0e680-monitor-financiero-chile
    paths:
      - .github/workflows/ffmm_carteras.yml
      - ffmm/scripts/actualizar_carteras.py
  workflow_dispatch:
    inputs:
      max_periodos:
        description: 'Máximo de meses a procesar en esta corrida'
        required: false
        default: '400'
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ffmm-carteras-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validar-y-publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    outputs:
      publicados: ${{ steps.publicar.outputs.publicados }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: python -m pip install --disable-pip-version-check pandas==2.2.3 pyarrow==21.0.0

      # Si todavía existen las descargas antiguas de FUTU/OPCI se reutilizan (mismo formato CMF).
      - name: Preparar caché de descargas
        run: |
          mkdir -p /tmp/cmf1333
          if [ -d ffmm/circular_1333_cartera/inputs ]; then cp ffmm/circular_1333_cartera/inputs/*.txt /tmp/cmf1333/ || true; fi

      - name: Diagnóstico de los meses pendientes (no escribe)
        continue-on-error: true
        run: python -m ffmm.scripts.actualizar_carteras --diagnostico --cache /tmp/cmf1333 --max-periodos "${{ inputs.max_periodos || '400' }}"

      - name: Descargar, validar y publicar los meses pendientes
        id: publicar
        run: python -m ffmm.scripts.actualizar_carteras --cache /tmp/cmf1333 --max-periodos "${{ inputs.max_periodos || '400' }}"

      - name: Confirmar los meses publicados
        if: always() && steps.publicar.outcome != 'skipped'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Primero solo los datos del sector (no chocan con otros workflows); luego, sobre la
          # versión más reciente de la rama, se recalculan las entradas del sector en data_manifest.json.
          git add docs/outputs/ffmm
          if git diff --cached --quiet; then echo 'Sin cambios.'; exit 0; fi
          ultimo=$(python -c "import json;print(max(json.load(open('docs/outputs/ffmm/manifest.json'))['periodos']))")
          git commit -m "FFMM: cartera de inversiones hasta ${ultimo}"
          git checkout -- data_manifest.json
          datos=$(git rev-parse HEAD)
          for i in 1 2 3 4 5; do
            git fetch origin "${GITHUB_REF_NAME}"
            git reset --hard FETCH_HEAD
            git cherry-pick "$datos"
            python -m ffmm.scripts.actualizar_carteras --solo-data-manifest
            git add data_manifest.json
            git diff --cached --quiet || git commit -m "FFMM: data_manifest"
            git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep 20
          done
          exit 1

  desplegar-sitio:
    needs: validar-y-publicar
    if: needs.validar-y-publicar.result == 'success' && needs.validar-y-publicar.outputs.publicados != '0' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
      - run: git pull --ff-only origin "${GITHUB_REF_NAME}" || true
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
