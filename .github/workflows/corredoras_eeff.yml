name: Estados financieros de corredores de bolsa y agentes de valores (CMF, FECU IFRS trimestral), cada 3 días, incremental

on:
  schedule:
    # Cada 3 días (13:45 UTC). Los trimestres cerrados (más de 150 días) no se vuelven a descargar; los
    # recientes se releen para sumar a quienes presentan tarde.
    - cron: '45 13 */3 * *'
  push:
    branches:
      - main
    paths:
      - .github/workflows/corredoras_eeff.yml
      - corredoras_bolsa/scripts/actualizar_eeff.py
      # Módulos compartidos que importa el extractor.
      - pipelines/auto/cuadratura.py
      - pipelines/auto/estable.py
  workflow_dispatch:
    inputs:
      desde:
        description: 'Primer cierre (AAAA-MM); vacío = autodescubre el más antiguo disponible'
        default: ''
        type: string
      hasta:
        description: 'Último cierre (vacío = último admisible por plazo CMF)'
        default: ''
        type: string
      minutos:
        description: 'Tiempo máximo en minutos; el progreso se conserva'
        default: '270'
        type: string
      max_periodos:
        description: 'Máximo de cierres a revisar por corrida (0 = sin tope)'
        default: '0'
        type: string

permissions:
  contents: write

concurrency:
  group: corredoras-eeff-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validar-y-publicar:
    runs-on: ubuntu-latest
    # El extractor se autolimita a 270 minutos (--minutos) y conserva el progreso; un tope del job
    # más corto (antes 60) mataba la corrida antes que el propio presupuesto, sin dejar publicar.
    timeout-minutes: 300
    outputs:
      publicados: ${{ steps.publicar.outputs.publicados }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: python -m pip install --disable-pip-version-check pandas==2.2.3 pyarrow==21.0.0 openpyxl==3.1.5

      # Sin red y en segundos: la lectura del Excel FECU, las compuertas contables (incluida la de
      # cobertura: un cambio de códigos no puede publicarse a ciegas) y la política incremental
      # no pueden llegar a la web sin haber pasado sus pruebas.
      - name: Pruebas del extractor y de las compuertas contables
        run: >
          python -m unittest -v
          corredoras_bolsa.tests.test_actualizar_eeff
          pipelines.auto.tests.test_cuadratura
          pipelines.auto.tests.test_estable

      - name: Descargar y publicar los trimestres pendientes
        id: publicar
        env:
          DESDE: ${{ inputs.desde }}
          HASTA: ${{ inputs.hasta }}
          MINUTOS: ${{ inputs.minutos }}
          PERIODOS: ${{ inputs.max_periodos }}
        run: |
          args=()
          if [ -n "${DESDE}" ]; then args+=(--desde "${DESDE}"); fi
          if [ -n "${HASTA}" ]; then args+=(--hasta "${HASTA}"); fi
          python corredoras_bolsa/scripts/actualizar_eeff.py --minutos "${MINUTOS:-270}" \
            --max-periodos "${PERIODOS:-0}" "${args[@]}"

      - name: Confirmar los trimestres publicados
        if: always() && steps.publicar.outcome != 'skipped'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/outputs/corredoras_bolsa/manifest.json docs/outputs/corredoras_bolsa/corredoras_bolsa_balance docs/outputs/corredoras_bolsa/corredoras_bolsa_resultados
          if git diff --cached --quiet; then echo 'Sin cambios.'; exit 0; fi
          ultimo=$(python -c "import json;print(max(k for k,v in json.load(open('docs/outputs/corredoras_bolsa/manifest.json'))['periodos'].items() if v.get('sociedades')))")
          git commit -m "Corredoras y agentes de valores: estados financieros hasta ${ultimo}"
          git checkout -- data_manifest.json
          datos=$(git rev-parse HEAD)
          # Varias publicaciones compiten por la misma rama: un cherry-pick en
          # conflicto o un push rechazado no deben abortar el paso (la shell corre
          # con `bash -e`). Se reintenta sobre la cabeza nueva, con espera aleatoria
          # para desincronizar las corridas que arrancan juntas.
          for i in 1 2 3 4 5 6 7 8; do
            git fetch origin "${GITHUB_REF_NAME}"
            git reset --hard FETCH_HEAD
            if ! git cherry-pick "$datos"; then
              git cherry-pick --abort || git reset --hard FETCH_HEAD
              echo "Cherry-pick en conflicto (intento ${i}/8): otra publicación tocó los mismos archivos."
              sleep $(( 15 + RANDOM % 20 ))
              continue
            fi
            python corredoras_bolsa/scripts/actualizar_eeff.py --solo-data-manifest
            python scripts/build_download_catalog.py
            git add data_manifest.json docs/js/download_catalog.js
            git diff --cached --quiet || git commit -m "Corredoras: data_manifest"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
            echo "Push rechazado (intento ${i}/8): otra corrida publicó primero."
            sleep $(( 15 + RANDOM % 20 ))
          done
          echo "::error title=Publicación en la rama::No se pudo publicar tras 8 intentos por contención en ${GITHUB_REF_NAME}"
          exit 1

