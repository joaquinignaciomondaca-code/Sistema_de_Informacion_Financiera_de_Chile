name: Fondos de inversión - balance y resultados XML IFRS CMF

on:
  push:
    branches: [main, 'arena/**']
    paths:
      - fi/scripts/validar_fuente_eeff.py
      - .github/workflows/fi_eeff.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fi-eeff-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validar-fuente:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Descargar muestras oficiales para verificar el formato (sin publicación)
        run: python -m fi.scripts.validar_fuente_eeff --solo-descargar
      # Bootstrap de fixtures pequeñas para pruebas: únicamente la rama de trabajo.
      # Se retira al quedar implementado el publicador; no publica tablas ni toca main.
      - name: Conservar fixtures originales para las pruebas del parser
        if: success() && github.ref_name != 'main'
        run: |
          mkdir -p fi/tests/fixtures
          cp .local-data/fi_eeff_muestra/*.xml .local-data/fi_eeff_muestra/*.html .local-data/fi_eeff_muestra/muestras.json fi/tests/fixtures/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fi/tests/fixtures
          if ! git diff --cached --quiet; then
            git commit -m "FI: fixtures oficiales para validar XML y cotejo de fichas"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Conservar muestras originales y fichas para el cotejo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fi-eeff-muestras-originales
          path: .local-data/fi_eeff_muestra/
          retention-days: 30
          if-no-files-found: error
