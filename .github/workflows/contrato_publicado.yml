name: Contrato derivado (web, esquemas, catálogo y resultados)

# Cuando un flujo de datos publica filas nuevas, los artefactos que se derivan de
# ellas se quedan atrás y `web_audit` falla en el siguiente push con «esquemas.json
# está desactualizado». Pasó el 2026-10-22: la serie diaria del Banco Central sumó
# 12 filas y el contrato quedó con un `data_release` viejo durante un día.
#
# Este flujo cierra el hueco en un solo sitio, en vez de repetir cuatro pasos en
# cada uno de los doce publicadores: si cambió algo bajo `docs/outputs/`, se
# regeneran los artefactos derivados sobre la cabeza vigente y se publican si hay
# diferencia real. Se regenera **después** del `reset --hard FETCH_HEAD` y nunca se
# arrastra un commit propio: dos publicadores a la vez no pueden chocar por un JSON
# intermedio (ver pipelines/auto/tests/test_contrato_publicadores.py).

on:
  push:
    branches:
      - main
    paths:
      - 'docs/outputs/**'
      - 'data_manifest.json'
      - 'scripts/build_metricas_publicadas.py'
      - 'scripts/build_macro_web.py'
      - 'macro/scripts/build_tablas_tematicas.py'
      - 'scripts/build_ficha_piloto.py'
      - 'scripts/construir_reproducibilidad.py'
  workflow_dispatch:
  # Los flujos de datos empujan con el GITHUB_TOKEN del propio Actions, y esos
  # push no disparan otros workflows (regla anti-recursión de GitHub). El 22 de
  # octubre los flujos publicaron corredoras y IFRS y este flujo no se ejecutó
  # ni una vez: el contrato siguió viejo y la auditoría falló en el PR siguiente.
  # El cron no depende del push, así que recoge cualquier deriva cada dos horas.
  schedule:
    - cron: '23 */2 * * *'

permissions:
  contents: write

concurrency:
  group: contrato-derivado
  cancel-in-progress: false

jobs:
  refrescar:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: python -m pip install --disable-pip-version-check duckdb pyarrow pandas==2.2.3

      # El guardián que gobierna a los publicadores se prueba antes de publicar:
      # si este flujo deja de cumplir el contrato de la rama, se sabe aquí.
      - name: Pruebas del contrato de publicación
        run: python -m unittest pipelines.auto.tests.test_contrato_publicadores

      - name: Publicar el contrato derivado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # El orden importa y es el mismo de docs/api/README.md: la
          # reconciliación nombra, las claves miden, los esquemas describen el
          # catálogo, el catálogo alimenta el Data Package y los resultados se
          # calculan sobre las vistas. La macro web se deriva también de sus
          # Parquet y del manifiesto ETL, antes de que API/Descargas publiquen
          # las mismas filas; al final se actualizan estado de claves, metadatos
          # sociales y reconciliación de métricas ETL/API/Descargas.
          #
          # El 2026-10-23 este flujo dejó fuera `claves.csv` y `esquemas.json`
          # respecto del corte macro y `audit` falló en main. La cadena se corre
          # entera y se comprueba entera antes de publicar.
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard FETCH_HEAD
            python scripts/build_reconciliacion.py
            python scripts/verificar_claves.py
            python scripts/build_esquemas.py
            python scripts/build_macro_web.py
            python scripts/build_api.py
            python scripts/build_contrato.py
            python scripts/build_ficha_piloto.py
            python scripts/build_resultados.py
            python scripts/build_download_catalog.py
            python scripts/build_metricas_publicadas.py
            python scripts/build_estado_claves.py
            python scripts/build_metadatos.py
            python scripts/construir_reproducibilidad.py
            python scripts/generar_indice_busqueda.py
            git add docs/api docs/js/download_catalog.js docs/js/estado_claves.js \
                    docs/js/sidebar.js docs/js/data_dictionary.js docs/js/erd_graph.js \
                    docs/vocabulario.json docs/metricas_publicadas.json docs/datos \
                    docs/index.html docs/privacidad.html docs/robots.txt docs/sitemap.xml \
                    docs/reproducibilidad docs/outputs/indice_busqueda.json
            if git diff --cached --quiet; then
              echo "::notice title=Contrato derivado::sin cambios; los artefactos ya reflejaban los datos publicados"
              exit 0
            fi
            git commit -m "Contrato derivado: esquemas, catálogo y resultados de los datos publicados"
            # Si la cadena quedó a medias, no se publica: se prefiere un push
            # fallido y visible a dejar main con las compuertas en rojo.
            python scripts/build_esquemas.py --check
            python scripts/build_macro_web.py --check
            python scripts/build_reconciliacion.py --check
            python scripts/build_api.py --check
            python scripts/build_contrato.py --check
            python scripts/build_ficha_piloto.py --check
            python scripts/build_download_catalog.py --check
            python scripts/build_metricas_publicadas.py --check
            python scripts/build_estado_claves.py --check
            python scripts/build_metadatos.py --check
            python scripts/construir_reproducibilidad.py --check
            python scripts/generar_indice_busqueda.py --check
            python scripts/auditar_contrato.py --check
            if git push origin HEAD:main; then
              echo "::notice title=Contrato derivado::publicado en main"
              exit 0
            fi
            echo "Push rechazado (intento ${i}/5): se regenera sobre la cabeza nueva."
            sleep $(( 10 + RANDOM % 20 ))
          done
          echo "::error title=Contrato derivado::no se pudo publicar tras 5 intentos"
          exit 1
