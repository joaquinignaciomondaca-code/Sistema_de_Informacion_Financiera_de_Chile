name: Cargar BigQuery (SIF Chile, Looker Studio)

# PLANTILLA: este archivo no se ejecuta porque no está en `.github/workflows/`.
# Para activarlo, cópialo a `.github/workflows/cargar_bigquery.yml` y configura:
#   * secreto  GCP_SA_KEY   → JSON de una cuenta de servicio con BigQuery Data Editor
#                              y BigQuery Job User.
#   * variable GCP_PROJECT  → ID del proyecto con facturación habilitada.
# Si lo activas, añade el flujo al calendario del README y al inventario que audita
# `scripts/audit_automatizacion.py`, o esa auditoría fallará al no reconocerlo.
#
# Qué hace: cuando un publicador deja filas nuevas (o cada 6 horas, por si el push
# del bot no dispara workflows), consolida el Parquet publicado y recarga las 86
# tablas en BigQuery. Looker Studio consulta BigQuery en vivo, así que el informe
# queda al día sin que nadie toque nada.

on:
  schedule:
    - cron: '40 4,10,16,22 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cargar-bigquery
  cancel-in-progress: false

jobs:
  cargar:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Autenticar en Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Instalar Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Instalar dependencias
        run: python -m pip install --disable-pip-version-check duckdb pyarrow pandas==2.2.3

      - name: Cargar el catálogo en BigQuery
        run: |
          python scripts/cargar_bigquery.py \
            --proyecto "${{ vars.GCP_PROJECT }}" \
            --dataset sif_chile \
            --verificar
