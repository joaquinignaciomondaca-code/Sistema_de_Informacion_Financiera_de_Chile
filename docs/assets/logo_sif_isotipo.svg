<!-- Isotipo SIF: sólo el símbolo de nodos, recortado del lockup
     logo_sif.svg y centrado en un lienzo cuadrado (180×180) para que sirva de
     favicon y de avatar sin que el navegador lo achate. Mismo trazado y mismos
     colores que el original; el único cambio es el viewBox y el
     desplazamiento del grupo. -->
