<!-- Variante compacta de logo_sif.svg: mismo trazado, recortado al símbolo de
     nodos y las siglas SIF (viewBox 0 0 305 180 en vez de 0 0 820 180). Es la
     que usa el encabezado del sitio, donde el lockup completo queda ilegible:
     a 32 px de alto, el texto del nombre completo bajaría a ~5 px. -->
